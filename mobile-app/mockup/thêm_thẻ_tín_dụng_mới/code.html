<!DOCTYPE html>
<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Thêm thẻ tín dụng mới</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      min-height: max(884px, 100dvh);
    }::-webkit-scrollbar {
        width: 0px;
        background: transparent;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased min-h-screen flex flex-col">
<div class="sticky top-0 z-10 flex items-center justify-between p-4 bg-background-light dark:bg-background-dark/95 backdrop-blur supports-[backdrop-filter]:bg-background-dark/60">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-slate-900 dark:text-white">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight text-slate-900 dark:text-white flex-1 text-center pr-10">Thêm thẻ mới</h2>
</div>
<main class="flex-1 flex flex-col w-full max-w-md mx-auto px-4 pb-8">
<div class="mt-2 mb-8 relative w-full aspect-[1.586/1] rounded-xl shadow-2xl overflow-hidden transition-all duration-300 transform hover:scale-[1.01]">
<div class="absolute inset-0 bg-gradient-to-br from-slate-800 to-primary" data-alt="Abstract blue gradient background"></div>
<div class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]"></div>
<div class="relative h-full flex flex-col justify-between p-6 text-white">
<div class="flex justify-between items-start">
<div class="w-12 h-9 rounded bg-yellow-200/20 border border-yellow-200/40 flex items-center justify-center overflow-hidden relative">
<div class="absolute w-[1px] h-full bg-yellow-200/30 left-1/3"></div>
<div class="absolute w-[1px] h-full bg-yellow-200/30 right-1/3"></div>
<div class="absolute h-[1px] w-full bg-yellow-200/30 top-1/3"></div>
<div class="absolute h-[1px] w-full bg-yellow-200/30 bottom-1/3"></div>
</div>
<span class="text-lg font-bold tracking-wider opacity-90 uppercase truncate max-w-[140px]">TPBank</span>
</div>
<div class="flex flex-col gap-1 mt-1">
<span class="text-[10px] uppercase text-white/70 font-semibold tracking-wider">Hạn mức tín dụng</span>
<p class="font-display text-3xl font-bold tracking-tight drop-shadow-md">50.000.000 <span class="text-base font-medium opacity-80">VND</span></p>
</div>
<div class="grid grid-cols-2 gap-4 items-end">
<div class="flex flex-col min-w-0">
<span class="text-[10px] uppercase text-white/70 font-semibold tracking-wider mb-0.5">Chủ thẻ</span>
<p class="font-medium tracking-wide text-sm sm:text-base uppercase truncate">NGUYEN VAN A</p>
</div>
<div class="flex justify-end gap-3 text-right">
<div class="flex flex-col items-end">
<span class="text-[10px] uppercase text-white/70 font-semibold tracking-wider mb-0.5">Sao kê</span>
<p class="font-bold text-sm">Ngày 20</p>
</div>
<div class="w-[1px] h-8 bg-white/20 mb-0.5"></div>
<div class="flex flex-col items-end">
<span class="text-[10px] uppercase text-white/70 font-semibold tracking-wider mb-0.5">Hạn TT</span>
<p class="font-bold text-sm text-yellow-300">Ngày 05</p>
</div>
</div>
</div>
</div>
</div>
<form class="space-y-5" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Tên ngân hàng</label>
<div class="relative">
<input class="w-full bg-white dark:bg-[#1c2127] border border-slate-300 dark:border-slate-700 rounded-lg h-12 pl-10 pr-4 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" placeholder="Ví dụ: TPBank, Vietcombank" type="text"/>
<span class="material-symbols-outlined absolute left-3 top-3 text-slate-400">account_balance</span>
</div>
</div>
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Hạn mức tín dụng</label>
<div class="relative">
<input class="w-full bg-white dark:bg-[#1c2127] border border-slate-300 dark:border-slate-700 rounded-lg h-12 pl-10 pr-4 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" inputmode="numeric" placeholder="50.000.000" type="text"/>
<span class="material-symbols-outlined absolute left-3 top-3 text-slate-400">payments</span>
<span class="absolute right-4 top-3 text-slate-400 font-medium">VND</span>
</div>
</div>
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Tên chủ thẻ</label>
<div class="relative">
<input class="w-full bg-white dark:bg-[#1c2127] border border-slate-300 dark:border-slate-700 rounded-lg h-12 pl-10 pr-4 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none uppercase" placeholder="NGUYEN VAN A" type="text"/>
<span class="material-symbols-outlined absolute left-3 top-3 text-slate-400">person</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Ngày sao kê</label>
<div class="relative">
<input class="w-full bg-white dark:bg-[#1c2127] border border-slate-300 dark:border-slate-700 rounded-lg h-12 pl-10 pr-4 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" placeholder="Ngày 20" type="text"/>
<span class="material-symbols-outlined absolute left-3 top-3 text-slate-400">receipt_long</span>
</div>
</div>
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Ngày thanh toán</label>
<div class="relative">
<input class="w-full bg-white dark:bg-[#1c2127] border border-slate-300 dark:border-slate-700 rounded-lg h-12 pl-10 pr-4 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" placeholder="Ngày 05" type="text"/>
<span class="material-symbols-outlined absolute left-3 top-3 text-slate-400">event_available</span>
</div>
</div>
</div>
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Giờ thanh toán</label>
<div class="relative">
<input class="w-full bg-white dark:bg-[#1c2127] border border-slate-300 dark:border-slate-700 rounded-lg h-12 pl-10 pr-4 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" type="time" value="09:00"/>
<span class="material-symbols-outlined absolute left-3 top-3 text-slate-400">schedule</span>
</div>
<p class="text-xs text-slate-500 px-1">Chúng tôi sẽ nhắc bạn thanh toán vào thời gian này.</p>
</div>
<div class="flex items-center justify-center gap-2 pt-4 opacity-60">
<span class="material-symbols-outlined text-emerald-500 text-lg">shield_lock</span>
<span class="text-xs text-slate-600 dark:text-slate-400 font-medium">Thông tin được bảo mật 100%</span>
</div>
<div class="pt-4 pb-4">
<button class="w-full bg-primary hover:bg-blue-600 active:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span>Lưu thẻ</span>
</button>
</div>
</form>
</main>

</body></html>
