<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng nhập - Ứng dụng Bóng đá &amp; Tài chính</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased">
<div class="relative flex min-h-screen w-full flex-col justify-center overflow-hidden bg-background-light dark:bg-background-dark">
<!-- Decoration / Background visual -->
<div class="absolute -top-24 -right-24 h-64 w-64 rounded-full bg-primary/20 blur-3xl"></div>
<div class="absolute -bottom-24 -left-24 h-64 w-64 rounded-full bg-primary/10 blur-3xl"></div>
<div class="relative mx-auto w-full max-w-md px-6 py-8 md:px-8">
<!-- Logo / Branding Area -->
<div class="mb-10 flex flex-col items-center justify-center text-center">
<div class="mb-6 flex h-20 w-20 items-center justify-center rounded-2xl bg-gradient-to-br from-primary to-blue-600 shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-4xl text-white">sports_soccer</span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Đăng nhập</h1>
<p class="mt-2 text-base text-slate-500 dark:text-slate-400">Chào mừng trở lại! Vui lòng đăng nhập để tiếp tục.</p>
</div>
<!-- Form -->
<div class="space-y-6">
<!-- Username Field -->
<div class="space-y-2">
<label class="text-sm font-medium leading-none text-slate-700 dark:text-slate-300" for="email">
                        Email hoặc Tên đăng nhập
                    </label>
<div class="relative flex items-center">
<input class="flex h-12 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 pl-11 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 dark:border-slate-700 dark:bg-[#1C2632] dark:text-white dark:ring-offset-slate-900 dark:placeholder:text-slate-400 dark:focus-visible:ring-primary transition-colors" id="email" placeholder="user@example.com" type="text"/>
<span class="material-symbols-outlined absolute left-3 text-[20px] text-slate-400">person</span>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="text-sm font-medium leading-none text-slate-700 dark:text-slate-300" for="password">
                            Mật khẩu
                        </label>
<a class="text-xs font-medium text-primary hover:text-primary/80 hover:underline" href="#">
                            Quên mật khẩu?
                        </a>
</div>
<div class="relative flex items-center">
<input class="flex h-12 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 pl-11 pr-10 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 dark:border-slate-700 dark:bg-[#1C2632] dark:text-white dark:ring-offset-slate-900 dark:placeholder:text-slate-400 dark:focus-visible:ring-primary transition-colors" id="password" placeholder="Nhập mật khẩu" type="password"/>
<span class="material-symbols-outlined absolute left-3 text-[20px] text-slate-400">lock</span>
<button class="absolute right-3 flex items-center justify-center text-slate-400 hover:text-slate-300 focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="inline-flex h-12 w-full items-center justify-center rounded-lg bg-primary px-6 py-3 text-sm font-semibold text-white shadow-md shadow-primary/20 transition-all hover:bg-primary/90 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 active:scale-[0.98] disabled:pointer-events-none disabled:opacity-50 dark:focus:ring-offset-slate-900">
                    Đăng nhập
                </button>
<!-- Biometric / Social Login Divider (Optional but fits modern UI) -->
<div class="relative my-6">
<div class="absolute inset-0 flex items-center">
<span class="w-full border-t border-slate-200 dark:border-slate-800"></span>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-background-light px-2 text-slate-500 dark:bg-background-dark dark:text-slate-400">Hoặc đăng nhập với</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex h-11 items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 dark:border-slate-700 dark:bg-[#1C2632] dark:text-slate-200 dark:hover:bg-[#25303e] dark:focus:ring-offset-slate-900 transition-colors">
<span class="material-symbols-outlined text-[20px]">fingerprint</span>
                        Face ID
                    </button>
<button class="flex h-11 items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 dark:border-slate-700 dark:bg-[#1C2632] dark:text-slate-200 dark:hover:bg-[#25303e] dark:focus:ring-offset-slate-900 transition-colors">
<img alt="Google Logo" class="h-5 w-5" data-alt="Google G colorful logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAmaA6vhd8Oi-BJlsF4QG0MyWwHFYQ7YR9GKhhlfLBangJjBLjSbAXn-sS0T6n2fPNZifjx-sTY1Udkyrwq13AhQ6MXbPXF3FIr8pvXNP2J_ze0MPFHkSakKUJE0O18_YFzkWcwZjLQ_h50wJVx3hfPDJ_mCv6R9FSFDFzyA4IKN4QI6HM6AAq4SRBRXrCaaMrv-Yz4bnDFZaasIGThcQvLcy5PW68_zuK2XhB7WJZN8yBuDhab2zRrgguN4ChLjE7luxX5ab7tnAaR"/>
                        Google
                    </button>
</div>
</div>
<!-- Footer -->
<div class="mt-8 text-center text-sm text-slate-500 dark:text-slate-400">
                Bạn chưa có tài khoản? 
                <a class="font-semibold text-primary hover:text-primary/80 hover:underline" href="#">
                    Đăng ký ngay
                </a>
</div>
</div>
</div>
</body></html>
