services:
  nginx:
    image: nginx:1.27-alpine
    container_name: kira-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    # Map host.docker.internal to the host gateway (IPv4). Without this, some
    # resolvers return only IPv6 and nginx gets "Network unreachable" -> 502.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KIRA_SERVICE_HOST: "${KIRA_SERVICE_HOST:-host.docker.internal}"
      KIRA_SERVICE_PORT: "${KIRA_SERVICE_PORT:-2308}"
      KIRA_QUEUE_HOST: "${KIRA_QUEUE_HOST:-host.docker.internal}"
      KIRA_QUEUE_PORT: "${KIRA_QUEUE_PORT:-2323}"
      KIRA_GATEWAY_HOST: "${KIRA_GATEWAY_HOST:-${KIRA_GATEWAY_HOST_1:-host.docker.internal}}"
      KIRA_GATEWAY_PORT: "${KIRA_GATEWAY_PORT:-${KIRA_GATEWAY_PORT_1:-8888}}"
      KIRA_DATA_MANAGER_HOST: "${KIRA_DATA_MANAGER_HOST:-${KIRA_DATA_MANAGER_HOST_1:-host.docker.internal}}"
      KIRA_DATA_MANAGER_PORT: "${KIRA_DATA_MANAGER_PORT:-${KIRA_DATA_MANAGER_PORT_1:-9198}}"
      KIRA_TOOL_SERVICE_HOST: "${KIRA_TOOL_SERVICE_HOST:-host.docker.internal}"
      KIRA_TOOL_SERVICE_PORT: "${KIRA_TOOL_SERVICE_PORT:-1406}"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./templates:/etc/nginx/templates:ro
    restart: unless-stopped
