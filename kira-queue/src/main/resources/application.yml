application:
  datasource:
    write:
      jdbc-url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:app}?useUnicode=true&createDatabaseIfNotExist=true"
      username: "${DB_USERNAME:root}"
      password: "${DB_PASSWORD:1234}"
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 100
spring:
  application:
    name: kira-queue
  profiles:
    active: composite
  output:
    ansi:
      enabled: NEVER
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  task:
    scheduling:
      pool:
        size: 120
    execution:
      pool:
        core-size: 120
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/}
    connection-timeout: 60000      # 60s
    requested-heartbeat: 30        # heartbeat 30s
    listener:
      simple:
        acknowledge-mode: auto        # ack tự động sau khi xử lý thành công
        concurrency: 1                # số consumer thread khởi tạo
        max-concurrency: 1           # scale tối đa 1 thread khi backlog tăng
        prefetch: 1                   # mỗi consumer lấy 1 message -> xử lý xong mới lấy tiếp
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
server:
  port: 2323
  servlet:
    context-path: /queue
  compression:
    enabled: true
    min-response-size: 512

logging:
  level:
    root: info
  file:
    # Gộp vào folder chung để Promtail đọc. Nhiều consumer / nhiều máy: set INSTANCE_ID để dễ tracking (vd. worker-1, host-a).
    name: ${LOG_DIR:../logs}/kira-queue-${INSTANCE_ID:local}.log
