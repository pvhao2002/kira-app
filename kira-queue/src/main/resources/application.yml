application:
  datasource:
    jdbc-url: "jdbc:mysql://${DB_PRIMARY_HOST:localhost}:${DB_PRIMARY_PORT:3310}/${DB_NAME:kira}?useUnicode=true&createDatabaseIfNotExist=true&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true"
    username: "${DB_APP_USER:kira_user}"
    password: "${DB_APP_PASSWORD:kira_password}"
    driver-class-name: com.mysql.cj.jdbc.Driver
spring:
  application:
    name: kira-queue
  output:
    ansi:
      enabled: NEVER
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  task:
    scheduling:
      pool:
        size: 120
    execution:
      pool:
        core-size: 120
  rabbitmq:
    host: ${RABBIT_HOST:192.168.2.221}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/}
    connection-timeout: 60000      # 60s
    requested-heartbeat: 30        # heartbeat 30s
    listener:
      simple:
        acknowledge-mode: auto        # ack tự động sau khi xử lý thành công
        concurrency: 1                # số consumer thread khởi tạo
        max-concurrency: 1           # scale tối đa 1 thread khi backlog tăng
        prefetch: 1                   # mỗi consumer lấy 1 message -> xử lý xong mới lấy tiếp
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
server:
  port: 2323
  servlet:
    context-path: /queue
  compression:
    enabled: true
    min-response-size: 512

kira:
  queue:
    consumer:
      date-enabled: ${KIRA_QUEUE_CONSUMER_DATE_ENABLED:${KIRA_QUEUE_CONSUMER_ENABLED:false}}
      event-enabled: ${KIRA_QUEUE_CONSUMER_EVENT_ENABLED:${KIRA_QUEUE_CONSUMER_ENABLED:false}}
      predict-enabled: ${KIRA_QUEUE_CONSUMER_PREDICT_ENABLED:${KIRA_QUEUE_CONSUMER_ENABLED:false}}
      predict-concurrency: ${KIRA_QUEUE_PREDICT_CONCURRENCY:8}
      predict-prefetch: ${KIRA_QUEUE_PREDICT_PREFETCH:${KIRA_QUEUE_PREDICT_CONCURRENCY:8}}
      settle-enabled: ${KIRA_QUEUE_CONSUMER_SETTLE_ENABLED:${KIRA_QUEUE_CONSUMER_ENABLED:false}}
    crawl-persist:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 50
      thread-name-prefix: crawl-persist-
      await-termination-seconds: 30

logging:
  level:
    root: info
  file:
    # Gộp vào folder chung để Promtail đọc. Nhiều consumer / nhiều máy: set INSTANCE_ID để dễ tracking (vd. worker-1, host-a).
    name: ${LOG_DIR:../logs}/kira-queue-${INSTANCE_ID:local}.log



app:
  kira-crawl:
    base-url: ${APP_KIRA_CRAWL_BASE_URL:http://localhost:4001}
    read-timeout-ms: ${APP_KIRA_CRAWL_READ_TIMEOUT_MS:300000}
  gateway:
    base-url: ${APP_GATEWAY_BASE_URL:http://localhost/gateway}
  odds-crawl-job:
    enabled: ${KIRA_CRAWL_ODDS_JOB_ENABLED:false}
    fixed-delay-seconds: ${KIRA_CRAWL_ODDS_JOB_DELAY_SECONDS:60}
    instance-id: ${KIRA_CRAWL_INSTANCE_ID:kira-crawl-java}
    read-timeout-ms: ${KIRA_CRAWL_GATEWAY_READ_TIMEOUT_MS:30000}
  playwright:
    headless: ${PLAYWRIGHT_HEADLESS:true}
    channel: ${PLAYWRIGHT_CHANNEL:}
    browser-timeout-ms: ${AISCORE_BROWSER_TIMEOUT_MS:30000}
    matches-async-timeout-ms: ${AISCORE_MATCHES_ASYNC_TIMEOUT_MS:180000}
    odds-async-timeout-ms: ${AISCORE_ODDS_ASYNC_TIMEOUT_MS:300000}
    user-agent: ${AISCORE_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36 Edg/142.0.0.0}
    accept-language: ${AISCORE_ACCEPT_LANGUAGE:en-US,en;q=0.9}
    cookie: ${AISCORE_COOKIE:}
    profile-base-dir: ${AISCORE_PROFILE_BASE_DIR:.playwright}
    # Isolate profiles per instance (defaults to server port, same idea as kira-crawl port_${PORT}_${api})
    profile-instance-id: ${PLAYWRIGHT_INSTANCE_ID:${KIRA_CRAWL_INSTANCE_ID:}}
    server-port: ${server.port}
    matches-concurrency: ${AISCORE_MATCHES_CONCURRENCY:1}
    odds-concurrency: ${AISCORE_ODDS_CONCURRENCY:5}
    acquire-timeout-ms: ${AISCORE_POOL_ACQUIRE_TIMEOUT_MS:120000}
    test-api-enabled: ${PLAYWRIGHT_TEST_API_ENABLED:true}
    matches-benchmark-base-url: ${MATCHES_BENCHMARK_BASE_URL:}
