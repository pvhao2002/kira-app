application:
  datasource:
    write:
      jdbc-url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kira}?useUnicode=true&createDatabaseIfNotExist=true"
      username: "${DB_USERNAME:root}"
      password: "${DB_PASSWORD:1234}"
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 5
spring:
  application:
    name: kira-service
  profiles:
    active: composite
  output:
    ansi:
      enabled: NEVER
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  task:
    scheduling:
      pool:
        size: 12
    execution:
      pool:
        core-size: 12
  rabbitmq:
    host: ${DB_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 60000         # timeout 60s khi tạo connection
    requested-heartbeat: 30           # giữ heartbeat để phát hiện connection chết
    cache:
      channel:
        size: 50                      # cho phép cache 50 channel (hữu ích khi publish nhiều message cùng lúc)
      connection:
        mode: CHANNEL                 # 1 TCP connection, nhiều channel để publish song song
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: false
server:
  port: 2308
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 512

logging:
  level:
    root: info
  file:
    name: target/kira.log
jwt:
  secret: "${JWT_SECRET:872c871a1ab996919a3e97145ece2418bb837cadbd69387d96cd45eef831f239}"
  expiration: "${JWT_EXPIRATION:86400}"
