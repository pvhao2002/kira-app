spring:
  application:
    name: kira-affilate-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  threads.virtual.enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3309/kira_affiliate?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data.web.pageable.max-page-size: 100
server:
  port: ${SERVER_PORT:8082}
  # Never expose exception details through Spring's fallback /error response.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel.enabled: false
management.endpoints.web.exposure.include: health,info
app:
  jwt:
    # No default: the service refuses to start without a real secret (>= 32 chars).
    secret: ${JWT_SECRET}
    access-ttl: PT15M
    refresh-ttl: P30D
  # Comma-separated exact origins (scheme://host[:port]). No wildcards.
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4202}
  login-rate-limit:
    max-attempts-per-ip: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_IP:20}
    ip-window: ${LOGIN_RATE_LIMIT_IP_WINDOW:PT5M}
    max-failures-per-email: ${LOGIN_RATE_LIMIT_MAX_FAILURES_PER_EMAIL:5}
    email-window: ${LOGIN_RATE_LIMIT_EMAIL_WINDOW:PT15M}
  refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
analytics:
  # Used to resolve the client IP for login rate limiting.
  trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1/32,::1/128}
shopee:
  # Fixed official endpoint; never taken from user input.
  endpoint: ${SHOPEE_AFFILIATE_ENDPOINT:https://open-api.affiliate.shopee.vn/graphql}
  # Base64 of 32 random bytes (openssl rand -base64 32). Required to store Shopee secrets.
  credential-encryption-key: ${SHOPEE_CREDENTIAL_ENCRYPTION_KEY:}
  connect-timeout: ${SHOPEE_CONNECT_TIMEOUT:5s}
  read-timeout: ${SHOPEE_READ_TIMEOUT:20s}
  max-attempts: ${SHOPEE_MAX_ATTEMPTS:3}
  retry-backoff: ${SHOPEE_RETRY_BACKOFF:2s}
  sync:
    enabled: ${SHOPEE_SYNC_ENABLED:true}
    cron: "${SHOPEE_SYNC_CRON:0 15 * * * *}"
    time-zone: Asia/Ho_Chi_Minh
    # Rolling purchase-time window re-read on every run so status changes (PENDING -> COMPLETED/CANCELLED) land.
    window-days: ${SHOPEE_SYNC_WINDOW_DAYS:30}
    chunk-days: ${SHOPEE_SYNC_CHUNK_DAYS:30}
    # Shopee: a query without scrollId must come > 30 s after the previous one.
    fresh-query-gap: ${SHOPEE_SYNC_FRESH_QUERY_GAP:31s}
springdoc:
  api-docs.enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
