<a class="sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-50 focus:rounded-lg focus:bg-white focus:px-3 focus:py-2 focus:shadow" href="#main" (click)="$event.preventDefault(); main.focus()">Bỏ qua điều hướng</a>

<header class="sticky top-0 z-30 flex h-14 items-center gap-3 border-b border-line bg-white px-4 lg:hidden">
  <button type="button" class="btn btn-sm px-2" (click)="drawerOpen.set(true)" aria-label="Mở menu" aria-controls="sidebar" [attr.aria-expanded]="drawerOpen()" data-testid="menu-open">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4.5h13M2.5 9h13M2.5 13.5h13"/></svg>
  </button>
  <span class="font-semibold">Kira Affiliate</span>
</header>

@if (drawerOpen()) {
  <button type="button" class="fixed inset-0 z-30 bg-ink/40 lg:hidden" aria-label="Đóng menu" (click)="drawerOpen.set(false)" data-testid="menu-backdrop"></button>
}

<aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-line bg-white transition-transform duration-200 lg:visible lg:translate-x-0"
       [class.-translate-x-full]="!drawerOpen()" [class.invisible]="!drawerOpen()">
  <div class="flex h-14 shrink-0 items-center gap-2.5 border-b border-line px-4">
    <span aria-hidden="true" class="grid h-7 w-7 place-items-center rounded-lg bg-brand text-sm font-bold text-white">K</span>
    <span class="font-semibold">Kira Affiliate</span>
  </div>
  <nav class="flex-1 overflow-y-auto p-3" aria-label="Điều hướng chính">
    <ul class="flex flex-col gap-0.5">
      @for (item of nav; track item.path) {
        <li>
          <a class="block rounded-lg px-3 py-2 text-sm font-medium text-muted transition-colors duration-150 hover:bg-canvas hover:text-ink"
             [routerLink]="item.path" routerLinkActive="!bg-brand-soft !text-brand-strong" ariaCurrentWhenActive="page" (click)="drawerOpen.set(false)"
             [attr.data-testid]="'nav-' + item.path">{{ item.label }}</a>
        </li>
      }
    </ul>
  </nav>
  <div class="shrink-0 border-t border-line p-3">
    <p class="truncate px-1 text-[13px] font-medium" data-testid="shell-user">{{ auth.user()?.fullName }}</p>
    <p class="truncate px-1 text-xs text-muted">{{ auth.user()?.email }}</p>
    <button type="button" class="btn btn-sm mt-2 w-full" (click)="logout()" data-testid="shell-logout">Đăng xuất</button>
  </div>
</aside>

<main #main id="main" tabindex="-1" class="min-w-0 outline-none lg:pl-64">
  <router-outlet/>
</main>
