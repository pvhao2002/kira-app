spring:
  application:
    name: kira-producer
  datasource:
    url: "jdbc:mysql://${DB_PRIMARY_HOST:localhost}:${DB_PRIMARY_PORT:3310}/${DB_NAME:kira}?useUnicode=true&createDatabaseIfNotExist=true"
    username: "${DB_APP_USER:kira_user}"
    password: "${DB_APP_PASSWORD:kira_password}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  output:
    ansi:
      enabled: NEVER
  task:
    scheduling:
      pool:
        size: 12
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/}
    connection-timeout: 60000
    requested-heartbeat: 30
    cache:
      channel:
        size: 50
      connection:
        mode: CHANNEL

# Set false on kira-service when this app runs crawl schedules (avoid duplicate queue messages).
# date-enabled / event-enabled: bật từng nhóm job. Nếu không set, dùng KIRA_PRODUCER_CRAWL_SCHEDULE_ENABLED (cả hai).
kira:
  producer:
    crawl-schedule:
      date-enabled: ${KIRA_PRODUCER_CRAWL_SCHEDULE_DATE_ENABLED:${KIRA_PRODUCER_CRAWL_SCHEDULE_ENABLED:false}}
      event-enabled: ${KIRA_PRODUCER_CRAWL_SCHEDULE_EVENT_ENABLED:${KIRA_PRODUCER_CRAWL_SCHEDULE_ENABLED:true}}
    soccer-team-recent-stat:
      enabled: ${KIRA_PRODUCER_SOCCER_TEAM_RECENT_STAT_ENABLED:true}
      cron: "${KIRA_PRODUCER_SOCCER_TEAM_RECENT_STAT_CRON:0 30 2 * * *}"

server:
  port: ${KIRA_PRODUCER_PORT:2311}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
  file:
    name: ${LOG_FILE:logs/kira-producer.log}
