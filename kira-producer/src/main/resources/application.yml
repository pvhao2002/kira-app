spring:
  application:
    name: kira-producer
  datasource:
    url: "jdbc:mysql://${DB_PRIMARY_HOST:localhost}:${DB_PRIMARY_PORT:3310}/${DB_NAME:kira}?useUnicode=true&createDatabaseIfNotExist=true&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true"
    username: "${DB_APP_USER:kira_user}"
    password: "${DB_APP_PASSWORD:kira_password}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  output:
    ansi:
      enabled: NEVER
  task:
    scheduling:
      pool:
        size: 12
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/}
    connection-timeout: 60000
    requested-heartbeat: 30
    cache:
      channel:
        size: 50
      connection:
        mode: CHANNEL

# Set false on kira-service when this app runs crawl schedules (avoid duplicate queue messages).
# date-enabled / event-enabled: bật từng nhóm job. Nếu không set, dùng KIRA_PRODUCER_CRAWL_SCHEDULE_ENABLED (cả hai).
kira:
  producer:
    claim-stale-after-seconds: ${CRAWL_CLAIM_STALE_AFTER_SECONDS:900}
    crawl-schedule:
      date-enabled: ${KIRA_PRODUCER_CRAWL_SCHEDULE_DATE_ENABLED:${KIRA_PRODUCER_CRAWL_SCHEDULE_ENABLED:true}}
      event-enabled: ${KIRA_PRODUCER_CRAWL_SCHEDULE_EVENT_ENABLED:${KIRA_PRODUCER_CRAWL_SCHEDULE_ENABLED:true}}
    predict-schedule:
      enabled: ${KIRA_PRODUCER_PREDICT_SCHEDULE_ENABLED:true}
      all-upcoming-enabled: ${KIRA_PRODUCER_PREDICT_ALL_UPCOMING_ENABLED:true}
      all-upcoming-delay-ms: ${KIRA_PRODUCER_PREDICT_ALL_UPCOMING_DELAY_MS:1800000}
      all-upcoming-initial-delay-ms: ${KIRA_PRODUCER_PREDICT_ALL_UPCOMING_INITIAL_DELAY_MS:300000}
      near-upcoming-enabled: ${KIRA_PRODUCER_PREDICT_NEAR_UPCOMING_ENABLED:true}
      near-upcoming-delay-ms: ${KIRA_PRODUCER_PREDICT_NEAR_UPCOMING_DELAY_MS:600000}
      near-upcoming-initial-delay-ms: ${KIRA_PRODUCER_PREDICT_NEAR_UPCOMING_INITIAL_DELAY_MS:180000}
      near-upcoming-window-hours: ${KIRA_PRODUCER_PREDICT_NEAR_UPCOMING_WINDOW_HOURS:3}
      backfill-enabled: ${KIRA_PRODUCER_PREDICT_BACKFILL_ENABLED:true}
      backfill-delay-ms: ${KIRA_PRODUCER_PREDICT_BACKFILL_DELAY_MS:3600000}
      backfill-initial-delay-ms: ${KIRA_PRODUCER_PREDICT_BACKFILL_INITIAL_DELAY_MS:600000}
    settle-schedule:
      enabled: ${KIRA_PRODUCER_SETTLE_SCHEDULE_ENABLED:true}
      delay-ms: ${KIRA_PRODUCER_SETTLE_SCHEDULE_DELAY_MS:600000}
      initial-delay-ms: ${KIRA_PRODUCER_SETTLE_SCHEDULE_INITIAL_DELAY_MS:180000}
      batch-limit: ${KIRA_PRODUCER_SETTLE_SCHEDULE_BATCH_LIMIT:500}


server:
  port: ${KIRA_PRODUCER_PORT:2311}
  servlet:
    context-path: /producer

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
  file:
    name: ${LOG_FILE:logs/kira-producer.log}
