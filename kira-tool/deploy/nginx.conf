limit_req_zone $binary_remote_addr zone=kiratool:10m rate=5r/s;
upstream kira_tool_service_upstream {
    server 127.0.0.1:1407;
    keepalive 16;
}
server {
    listen 80;
    server_name kira.id.vn tool.kira.id.vn;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name kira.id.vn;
    ssl_certificate /etc/nginx/tls/kira.id.vn.crt;
    ssl_certificate_key /etc/nginx/tls/kira.id.vn.key;
    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 443 ssl http2;
    server_name tool.kira.id.vn;
    ssl_certificate /etc/letsencrypt/live/tool.kira.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tool.kira.id.vn/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / {
        proxy_pass http://127.0.0.1:4202;
        proxy_set_header Host $host;
    }
    location /tool-service/ {
        proxy_pass http://kira_tool_service_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8k;
        proxy_read_timeout 300s;
        limit_req zone=kiratool burst=20 nodelay;
    }
}
