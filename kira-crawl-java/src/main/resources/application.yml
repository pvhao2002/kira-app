server:
  port: ${KIRA_CRAWL_PORT:${PORT:4000}}

spring:
  application:
    name: kira-crawl-java
  threads:
    virtual:
      enabled: true

app:
  gateway:
    base-url: ${APP_GATEWAY_BASE_URL:http://localhost/gateway}
  odds-crawl-job:
    enabled: ${KIRA_CRAWL_ODDS_JOB_ENABLED:false}
    fixed-delay-seconds: ${KIRA_CRAWL_ODDS_JOB_DELAY_SECONDS:60}
    instance-id: ${KIRA_CRAWL_INSTANCE_ID:kira-crawl-java}
    read-timeout-ms: ${KIRA_CRAWL_GATEWAY_READ_TIMEOUT_MS:30000}
  playwright:
    headless: ${PLAYWRIGHT_HEADLESS:true}
    channel: ${PLAYWRIGHT_CHANNEL:}
    browser-timeout-ms: ${AISCORE_BROWSER_TIMEOUT_MS:80000}
    matches-async-timeout-ms: ${AISCORE_MATCHES_ASYNC_TIMEOUT_MS:180000}
    odds-async-timeout-ms: ${AISCORE_ODDS_ASYNC_TIMEOUT_MS:300000}
    user-agent: ${AISCORE_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36 Edg/142.0.0.0}
    accept-language: ${AISCORE_ACCEPT_LANGUAGE:en-US,en;q=0.9}
    cookie: ${AISCORE_COOKIE:}
    profile-base-dir: ${AISCORE_PROFILE_BASE_DIR:.playwright}
    # Isolate profiles per instance (defaults to server port, same idea as kira-crawl port_${PORT}_${api})
    profile-instance-id: ${PLAYWRIGHT_INSTANCE_ID:${KIRA_CRAWL_INSTANCE_ID:}}
    server-port: ${server.port}
    matches-concurrency: ${AISCORE_MATCHES_CONCURRENCY:1}
    odds-concurrency: ${AISCORE_ODDS_CONCURRENCY:1}
    acquire-timeout-ms: ${AISCORE_POOL_ACQUIRE_TIMEOUT_MS:120000}
    test-api-enabled: ${PLAYWRIGHT_TEST_API_ENABLED:true}
    matches-benchmark-base-url: ${MATCHES_BENCHMARK_BASE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /docs/openapi

logging:
  file:
    name: ${LOG_FILE:../logs/kira-crawl-java.log}
