# Production on the shared Oracle Cloud VPS (ARM64), next to MatchMind. Built from source on the server
# (no amd64 images there); secrets live in ~/kira-memory/.env on the server only. Host nginx terminates TLS for
# memory.kira.id.vn and proxies to 127.0.0.1:4206. See docs/deployment.md.
name: kira-memory

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      MYSQL_DATABASE: kira_memory
      MYSQL_USER: kira_memory
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    # The host is shared: cap each container so one app cannot starve the others.
    mem_limit: 1g

  kira-memory-service:
    build: ./kira-memory-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/kira_memory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: kira_memory
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      MEDIA_URL_SECRET: ${MEDIA_URL_SECRET:?set MEDIA_URL_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      HF_DATASET_REPO: ${HF_DATASET_REPO:-}
      HF_TOKEN: ${HF_TOKEN:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_REGION: ${R2_REGION:-auto}
      UPLOAD_PARALLEL_STORES: ${UPLOAD_PARALLEL_STORES:-2}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_SITE_URL: ${CF_SITE_URL:-}
    volumes:
      - upload-tmp:/data/uploads
    # Heap = 75% of this (MaxRAMPercentage in the Dockerfile); uploads stream to disk, never to RAM.
    mem_limit: 1g

  kira-memory-ui:
    build: ./kira-memory-ui
    restart: unless-stopped
    depends_on:
      kira-memory-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${UI_PORT:-4206}:80"
    mem_limit: 128m

volumes:
  mysql-data:
  upload-tmp:
