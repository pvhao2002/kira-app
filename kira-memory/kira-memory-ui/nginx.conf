# Serves the app and proxies the API, SSE and media to the service on the same origin
# (the session cookie is SameSite=Strict). TLS ends at Cloudflare or the host proxy in front of this.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Uploads arrive in 32 MB chunks (Cloudflare caps requests at 100 MB); the completing form is under 4 MB.
  client_max_body_size 40m;

  # Only set here: an add_header inside a location would drop all of these for that location.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # The service sends its own copies; keep only the ones above.
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;

  # Realtime messages: no buffering, and keep the stream open (the service pings every 25 s).
  location = /api/events {
    proxy_pass http://kira-memory-service:8086;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://kira-memory-service:8086;
    # Stream upload chunks straight through instead of spooling them to nginx's disk first.
    proxy_request_buffering off;
  }

  # Photos and videos: the service sets the long-lived Cache-Control; stream big videos instead of buffering them.
  location /m/ {
    proxy_pass http://kira-memory-service:8086;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /actuator/ { return 404; }

  # Bundles have content hashes in their names; index.html must always be fresh.
  location ~* \.(?:js|css|woff2?|svg)$ { expires 1y; }
  location = /index.html { expires -1; }
  location / { try_files $uri $uri/ /index.html; }
}
