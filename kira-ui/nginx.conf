# Reverse proxy toward the Compose "nginx" service (host :80 → backends).
upstream kira_reverse_proxy_main {
  server nginx:80;
  keepalive_requests 1000;
  keepalive_timeout 75s;
  keepalive 128;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

  # Same hop tuning as nginx/templates/kira-services.conf — pooling + avoid retry amplification.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_connect_timeout 10s;
  proxy_send_timeout 120s;
  proxy_read_timeout 120s;

  location /gateway/ {
    proxy_pass http://kira_reverse_proxy_main;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /data/ {
    proxy_pass http://kira_reverse_proxy_main;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /tool-service/ {
    proxy_pass http://kira_reverse_proxy_main;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
