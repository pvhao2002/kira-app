<div class="px-6 py-8 w-full max-w-[1440px] mx-auto">
  <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
    <span class="material-symbols-outlined text-blue-500">calendar_today</span>
    Saturday, 14/10
  </h2>

  <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
    <!-- Result Card 1 -->
    <article
      class="bg-[#1e293b] rounded-xl border border-slate-700 overflow-hidden shadow-sm hover:shadow-lg transition-all duration-300">
      <div class="bg-slate-900/40 px-6 py-4 border-b border-slate-700 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <span
            class="bg-slate-700 text-blue-200 text-xs px-2.5 py-1 rounded border border-slate-600 font-bold uppercase tracking-wider shadow-sm">Premier League</span>
          <span class="text-slate-400 text-sm font-medium">19:00 - 14/10</span>
        </div>
        <div class="flex gap-4 text-xs font-mono text-slate-400">
          <span>HDC: <strong class="text-white">0:0.5</strong></span>
          <span>O/U: <strong class="text-white">2.75</strong></span>
        </div>
      </div>
      <div class="p-6 flex items-center justify-between">
        <div class="flex flex-col items-center gap-3 w-1/3 text-center">
          <div
            class="w-16 h-16 bg-[#151e32] rounded-full p-2 shadow-sm flex items-center justify-center border border-slate-700">
            <span class="text-2xl font-bold text-white">MU</span>
          </div>
          <h3 class="text-base font-bold text-white">Man United</h3>
        </div>
        <div class="flex flex-col items-center w-1/3">
          <div class="text-4xl font-black text-white tracking-tight flex items-center gap-3">
            <span>2</span><span class="text-slate-600">-</span><span>1</span>
          </div>
          <div
            class="mt-2 flex items-center gap-2 text-xs font-medium text-slate-400 bg-slate-800/30 px-3 py-1 rounded-full border border-white/5">
            <span class="material-symbols-outlined text-[16px]">flag</span>
            <span>Corners: 5 - 4</span>
          </div>
        </div>
        <div class="flex flex-col items-center gap-3 w-1/3 text-center">
          <div
            class="w-16 h-16 bg-[#151e32] rounded-full p-2 shadow-sm flex items-center justify-center border border-slate-700">
            <span class="text-2xl font-bold text-white">CHE</span>
          </div>
          <h3 class="text-base font-bold text-white">Chelsea</h3>
        </div>
      </div>
      <div class="px-6 pb-6">
        <div class="overflow-x-auto rounded-lg border border-slate-700">
          <table class="w-full text-sm text-left">
            <thead class="text-xs text-slate-400 uppercase bg-slate-900/50 border-b border-slate-700">
            <tr>
              <th class="px-4 py-3 font-medium">Type</th>
              <th class="px-4 py-3 font-medium">Prediction</th>
              <th class="px-4 py-3 font-medium">Results</th>
              <th class="px-4 py-3 font-medium text-center">Status</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-700 bg-[#1e293b]/50">
            <tr class="hover:bg-slate-700/30 transition-colors">
              <td class="px-4 py-3 font-medium text-white">HDC</td>
              <td class="px-4 py-3 text-gray-300">MU -0.5</td>
              <td class="px-4 py-3 text-gray-300">Win</td>
              <td class="px-4 py-3 text-center">
                <span
                  class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Win</span>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </article>
  </div>
</div>
