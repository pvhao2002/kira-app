<div class="bank-page max-w-4xl space-y-5"><div><a routerLink="/bank-card/statements" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-blue-400"><span class="material-symbols-outlined text-[18px]">arrow_back</span>Quay lại sao kê</a><h1 class="mt-4 text-2xl font-bold text-white">Tạo kỳ sao kê</h1><p class="mt-1 text-sm text-slate-400">Ngày sao kê và hạn trả sẽ tự tính theo cấu hình thẻ nếu để trống.</p></div><form [formGroup]="form" (ngSubmit)="submit()" class="bank-panel space-y-5 p-6"><div class="grid gap-4 sm:grid-cols-2"><label class="text-sm text-slate-300">Thẻ<select formControlName="creditCardId" class="bank-input mt-2"><option value="">Chọn thẻ</option>@for (card of cards(); track card.creditCardId) {<option [value]="card.creditCardId">{{ card.cardLabel }} •••• {{ card.lastFour }}</option>}</select></label><label class="text-sm text-slate-300">Kỳ tháng<input type="month" formControlName="cycleMonth" class="bank-input mt-2"></label></div><div class="grid gap-4 sm:grid-cols-2"><label class="text-sm text-slate-300">Ngày sao kê (tùy chọn)<input type="date" formControlName="statementDate" class="bank-input mt-2"></label><label class="text-sm text-slate-300">Hạn thanh toán (tùy chọn)<input type="date" formControlName="dueDate" class="bank-input mt-2"></label></div><div class="grid gap-4 sm:grid-cols-2"><label class="text-sm text-slate-300">Số tiền sao kê<input formControlName="statementAmount" inputmode="numeric" class="bank-input mt-2" placeholder="Để trống nếu chưa chốt"></label><label class="text-sm text-slate-300">Ghi chú<input formControlName="note" class="bank-input mt-2"></label></div><label class="flex items-center gap-3 rounded-lg border border-[#17324d] p-4 text-sm text-slate-300"><input type="checkbox" formControlName="issued" class="size-4 accent-blue-600">Đánh dấu sao kê đã chốt</label><div class="flex justify-end gap-3"><a routerLink="/bank-card/statements" class="bank-secondary-button">Hủy</a><button type="submit" class="bank-primary-button" [disabled]="saving()">{{ saving() ? 'Đang lưu...' : 'Tạo kỳ sao kê' }}</button></div></form></div>
