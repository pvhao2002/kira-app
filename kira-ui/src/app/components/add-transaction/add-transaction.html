<div class="flex-1 w-full max-w-[1000px] mx-auto px-4 md:px-8 py-8 md:py-12">
  <div class="mb-8 md:mb-10">
    <div class="flex flex-col gap-2">
      <a routerLink="/transactions" class="flex items-center gap-2 mb-2 group cursor-pointer w-fit">
        <div
          class="flex items-center justify-center rounded-full size-8 bg-white dark:bg-[#1f2937] text-blue-800 dark:text-blue-400 group-hover:bg-blue-800 group-hover:text-white transition-colors shadow-sm border border-[#e2e8f0] dark:border-[#374151]">
          <span class="material-symbols-outlined text-lg">arrow_back</span>
        </div>
        <span
          class="text-sm font-semibold text-blue-800 dark:text-blue-400 group-hover:text-blue-900 dark:group-hover:text-blue-300 transition-colors">Quay lại danh sách</span>
      </a>
      <h1 class="text-[#0f3575] dark:text-white text-3xl md:text-4xl font-extrabold tracking-tight">Thêm giao dịch
        mới</h1>
      <p class="text-[#64748b] dark:text-gray-400 text-base">Nhập thông tin chi tiết để ghi nhận giao dịch vào hệ
        thống.</p>
    </div>
  </div>

  <div
    class="bg-white dark:bg-[#111827] rounded-xl shadow-[0_1px_3px_0_rgba(0,0,0,0.1),0_1px_2px_-1px_rgba(0,0,0,0.1)] border border-[#e2e8f0] dark:border-[#1f2937] overflow-hidden">
    <form class="flex flex-col">
      <div class="p-6 md:p-8 border-b border-[#f1f5f9] dark:border-[#1f2937]">
        <label class="block text-[#1e293b] dark:text-gray-200 text-sm font-bold uppercase tracking-wider mb-4">Loại giao
          dịch</label>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <label class="cursor-pointer relative">
            <input type="radio" name="transaction_type" value="deposit" class="peer sr-only" checked/>
            <div
              class="flex flex-col items-center justify-center py-4 px-2 rounded-lg border-2 border-transparent bg-[#f8fafc] dark:bg-[#1f2937] text-[#64748b] dark:text-gray-400 hover:bg-[#f1f5f9] dark:hover:bg-[#374151] transition-all peer-checked:bg-[#eff6ff] dark:peer-checked:bg-[#1e3a8a]/20 peer-checked:border-blue-600 peer-checked:text-blue-600 dark:peer-checked:text-blue-400">
              <span class="material-symbols-outlined text-2xl mb-1.5">download</span>
              <span class="text-sm font-semibold">Nạp tiền</span>
            </div>
          </label>
          <label class="cursor-pointer relative">
            <input type="radio" name="transaction_type" value="withdraw" class="peer sr-only"/>
            <div
              class="flex flex-col items-center justify-center py-4 px-2 rounded-lg border-2 border-transparent bg-[#f8fafc] dark:bg-[#1f2937] text-[#64748b] dark:text-gray-400 hover:bg-[#f1f5f9] dark:hover:bg-[#374151] transition-all peer-checked:bg-[#fff1f2] dark:peer-checked:bg-[#7f1d1d]/20 peer-checked:border-rose-500 peer-checked:text-rose-600 dark:peer-checked:text-rose-400">
              <span class="material-symbols-outlined text-2xl mb-1.5">upload</span>
              <span class="text-sm font-semibold">Rút tiền</span>
            </div>
          </label>
          <label class="cursor-pointer relative">
            <input type="radio" name="transaction_type" value="bonus" class="peer sr-only"/>
            <div
              class="flex flex-col items-center justify-center py-4 px-2 rounded-lg border-2 border-transparent bg-[#f8fafc] dark:bg-[#1f2937] text-[#64748b] dark:text-gray-400 hover:bg-[#f1f5f9] dark:hover:bg-[#374151] transition-all peer-checked:bg-[#ecfdf5] dark:peer-checked:bg-[#064e3b]/20 peer-checked:border-emerald-500 peer-checked:text-emerald-600 dark:peer-checked:text-emerald-400">
              <span class="material-symbols-outlined text-2xl mb-1.5">card_giftcard</span>
              <span class="text-sm font-semibold">Tiền thưởng</span>
            </div>
          </label>
        </div>
      </div>

      <div class="p-6 md:p-8 space-y-8">
        <div>
          <label class="block text-[#1e293b] dark:text-gray-200 text-sm font-bold mb-2">Số tiền (VNĐ)</label>
          <div class="relative group">
            <span
              class="absolute left-4 top-1/2 -translate-y-1/2 text-[#94a3b8] font-bold text-lg pointer-events-none group-focus-within:text-blue-600 transition-colors">₫</span>
            <input type="text" placeholder="0"
                   class="w-full bg-white dark:bg-[#111827] border border-[#cbd5e1] dark:border-[#374151] text-[#1e293b] dark:text-white text-2xl font-bold rounded-lg pl-10 pr-4 py-4 focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all placeholder:text-gray-300"/>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-[#1e293b] dark:text-gray-200 text-sm font-bold mb-2">Ngày giao dịch</label>
            <div class="relative">
              <input type="date" value="2023-10-24"
                     class="w-full bg-white dark:bg-[#111827] border border-[#cbd5e1] dark:border-[#374151] text-[#1e293b] dark:text-white rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all font-medium"/>
            </div>
          </div>
          <div>
            <label class="block text-[#1e293b] dark:text-gray-200 text-sm font-bold mb-2">Giờ giao dịch</label>
            <div class="relative">
              <input type="time" value="14:30"
                     class="w-full bg-white dark:bg-[#111827] border border-[#cbd5e1] dark:border-[#374151] text-[#1e293b] dark:text-white rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all font-medium"/>
            </div>
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-[#1e293b] dark:text-gray-200 text-sm font-bold">Mô tả</label>
            <span class="text-xs font-medium text-[#64748b] bg-[#f1f5f9] dark:bg-[#1f2937] px-2.5 py-1 rounded-full">Tùy chọn</span>
          </div>
          <textarea rows="3" placeholder="Nhập ghi chú cho giao dịch này..."
                    class="w-full bg-white dark:bg-[#111827] border border-[#cbd5e1] dark:border-[#374151] text-[#1e293b] dark:text-white text-base rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all resize-none placeholder:text-gray-400"></textarea>
        </div>
      </div>

      <div
        class="p-6 md:px-8 md:py-6 bg-[#f8fafc] dark:bg-[#1f2937] border-t border-[#f1f5f9] dark:border-[#374151] flex flex-col-reverse sm:flex-row items-center justify-end gap-4">
        <button type="button"
                class="w-full sm:w-auto px-6 h-11 rounded-lg border border-[#cbd5e1] dark:border-[#4b5563] bg-white dark:bg-[#374151] text-[#475569] dark:text-gray-200 text-sm font-semibold hover:bg-gray-50 dark:hover:bg-[#4b5563] transition-colors focus:ring-2 focus:ring-gray-200">
          Hủy bỏ
        </button>
        <button type="button"
                class="w-full sm:w-auto px-8 h-11 rounded-lg bg-blue-700 hover:bg-blue-800 text-white text-sm font-bold shadow-lg shadow-blue-900/10 hover:shadow-blue-900/20 transition-all flex items-center justify-center gap-2 focus:ring-2 focus:ring-blue-700/30 focus:ring-offset-1">
          <span class="material-symbols-outlined text-[20px]">save</span>
          Lưu giao dịch
        </button>
      </div>
    </form>
  </div>
</div>
