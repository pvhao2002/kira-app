<div class="max-w-4xl mx-auto w-full px-4 py-8 lg:px-8">
  <div class="bg-[#1e293b] rounded-xl p-6 lg:p-8 shadow-sm border border-slate-700 mb-6 relative overflow-hidden">
    <div class="absolute top-0 right-0 -mt-10 -mr-10 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl"></div>
    <div class="flex flex-col sm:flex-row items-center gap-8 relative z-10">
      <div class="relative group cursor-pointer shrink-0">
        <div class="size-28 lg:size-32 rounded-full bg-center bg-cover border-4 border-slate-700 shadow-lg"
             style='background-image: url("https://picsum.photos/seed/user/200/200");'></div>
        <div
          class="absolute bottom-1 right-1 bg-blue-600 text-white p-2 rounded-full border-2 border-slate-700 hover:bg-blue-500 transition-colors">
          <span class="material-symbols-outlined text-[18px] leading-none block font-bold">edit</span>
        </div>
      </div>
      <div class="text-center sm:text-left flex-1 min-w-0">
        <h2 class="text-3xl font-bold text-white mb-2">Nguyễn Văn A</h2>
        <p class="text-slate-400 font-medium mb-4 text-base">nguyen.a&#64;example.com</p>
        <div class="flex flex-wrap items-center justify-center sm:justify-start gap-3">
          <div
            class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-yellow-900/20 text-yellow-500 text-xs font-bold border border-yellow-800/50 uppercase tracking-wide">
            <span class="material-symbols-outlined text-[16px]">workspace_premium</span>
            Thành viên VIP
          </div>
          <div
            class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-900/20 text-blue-400 text-xs font-bold border border-blue-800/50">
            <span class="material-symbols-outlined text-[16px]">verified</span>
            Đã xác thực
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 space-y-6">
      <section class="bg-[#1e293b] rounded-xl p-6 shadow-sm border border-slate-700">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <span class="material-symbols-outlined text-blue-500">edit_note</span>
            Ghi chú cá nhân
          </h3>
          <span class="text-xs text-slate-500">Lưu lần cuối: Hôm nay 10:30</span>
        </div>
        <div class="relative">
          <textarea
            class="w-full bg-[#0b1121] border border-slate-700 rounded-lg p-4 text-gray-200 placeholder-slate-500 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 outline-none transition-all resize-none h-48"
            placeholder="Viết chiến thuật, ghi nhớ hoặc mục tiêu tài chính của bạn tại đây..."></textarea>
          <div class="absolute bottom-3 right-3">
            <button
              class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-2 rounded-lg shadow-lg shadow-blue-500/20 transition-all flex items-center gap-2 text-sm">
              <span class="material-symbols-outlined text-[18px]">save</span>
              Lưu ghi chú
            </button>
          </div>
        </div>
      </section>
    </div>

    <div class="lg:col-span-1">
      <div class="flex flex-col gap-2 sticky top-[100px]">
        <h3 class="px-1 text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">Bảo mật & Cài đặt</h3>
        <div
          class="bg-[#1e293b] rounded-xl border border-slate-700 overflow-hidden divide-y divide-slate-700 shadow-sm">
          <button
            class="w-full flex items-center justify-between p-4 hover:bg-slate-800 transition-colors text-left group">
            <div class="flex items-center gap-3">
              <div
                class="size-8 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-blue-500/10 group-hover:text-blue-500 transition-colors text-slate-400">
                <span class="material-symbols-outlined text-[20px]">lock</span>
              </div>
              <span class="text-gray-200 font-medium text-sm">Đổi mật khẩu</span>
            </div>
            <span class="material-symbols-outlined text-slate-500 text-[20px]">chevron_right</span>
          </button>
          <button
            class="w-full flex items-center justify-between p-4 hover:bg-slate-800 transition-colors text-left group">
            <div class="flex items-center gap-3">
              <div
                class="size-8 rounded-lg bg-slate-800 flex items-center justify-center group-hover:bg-blue-500/10 group-hover:text-blue-500 transition-colors text-slate-400">
                <span class="material-symbols-outlined text-[20px]">notifications</span>
              </div>
              <span class="text-gray-200 font-medium text-sm">Thông báo</span>
            </div>
            <span class="material-symbols-outlined text-slate-500 text-[20px]">chevron_right</span>
          </button>
        </div>
        <button
          class="mt-4 w-full flex items-center justify-center gap-2 p-3 rounded-xl text-red-400 bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 transition-all font-semibold text-sm">
          <span class="material-symbols-outlined text-[20px]">logout</span>
          Đăng xuất
        </button>
      </div>
    </div>
  </div>
</div>
