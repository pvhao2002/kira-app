<div class="bank-page max-w-5xl space-y-5"><div><a routerLink="/bank-card/mcc" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-blue-400"><span class="material-symbols-outlined text-[18px]">arrow_back</span>Quay lại MCC</a><h1 class="mt-4 text-2xl font-bold text-white">Thêm danh mục MCC</h1><p class="mt-1 text-sm text-slate-400">Tạo danh mục và cấu hình cashback cho một hoặc nhiều thẻ.</p></div><form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5"><section class="bank-panel grid gap-4 p-6 sm:grid-cols-[180px_1fr]"><label class="text-sm text-slate-300">MCC code<input maxlength="4" inputmode="numeric" formControlName="mccCode" class="bank-input mt-2" placeholder="5411"></label><label class="text-sm text-slate-300">Tên danh mục<input formControlName="categoryName" class="bank-input mt-2" placeholder="Cửa hàng tạp hóa, siêu thị"></label><label class="text-sm text-slate-300 sm:col-span-2">Mô tả<input formControlName="description" class="bank-input mt-2" placeholder="Ghi chú phạm vi áp dụng"></label></section><section class="bank-panel overflow-hidden"><div class="flex items-center justify-between border-b border-[#17324d] px-5 py-4"><div><h2 class="font-bold text-white">Rule cashback theo thẻ</h2><p class="mt-1 text-xs text-slate-500">Các khoảng hiệu lực của cùng một thẻ không được chồng nhau.</p></div><button type="button" class="bank-secondary-button" (click)="addRule()"><span class="material-symbols-outlined text-[17px]">add</span>Thêm thẻ</button></div><div formArrayName="rules" class="divide-y divide-[#17324d]">@for (rule of rules.controls; track $index; let i = $index) {<div [formGroupName]="i" class="grid gap-4 p-5 sm:grid-cols-2 xl:grid-cols-[1.2fr_0.7fr_1fr_1fr_1fr_40px]"><label class="text-xs text-slate-400">Thẻ<select formControlName="creditCardId" class="bank-input mt-2"><option value="">Chọn thẻ</option>@for (card of cards(); track card.creditCardId) {<option [value]="card.creditCardId">{{ card.cardLabel }}</option>}</select></label><label class="text-xs text-slate-400">Tỷ lệ (%)<input type="number" min="0" max="100" step="0.01" formControlName="cashbackRate" class="bank-input mt-2"></label><label class="text-xs text-slate-400">Trần tháng<input formControlName="monthlyCapAmount" inputmode="numeric" class="bank-input mt-2" placeholder="Không giới hạn"></label><label class="text-xs text-slate-400">Từ ngày<input type="date" formControlName="effectiveFrom" class="bank-input mt-2"></label><label class="text-xs text-slate-400">Đến ngày<input type="date" formControlName="effectiveTo" class="bank-input mt-2"></label><button type="button" class="self-end pb-3 text-slate-500 hover:text-rose-400" [disabled]="rules.length === 1" (click)="removeRule(i)" title="Xóa rule"><span class="material-symbols-outlined">delete</span></button><label class="text-xs text-slate-400 sm:col-span-2 xl:col-span-6">Ghi chú<input formControlName="note" class="bank-input mt-2"></label></div>}</div></section><div class="flex justify-end gap-3"><a routerLink="/bank-card/mcc" class="bank-secondary-button">Hủy</a><button type="submit" class="bank-primary-button" [disabled]="saving()">{{ saving() ? 'Đang lưu...' : 'Lưu MCC' }}</button></div></form></div>
