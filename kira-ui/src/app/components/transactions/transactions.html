<div
  class="w-full max-w-4xl flex flex-col min-h-screen bg-[#0b1121] relative mx-auto border-x border-slate-800/50 shadow-2xl shadow-blue-900/10">
  <header
    class="sticky top-0 z-40 flex items-center justify-between border-b border-slate-800 bg-[#0b1121]/80 backdrop-blur-md px-6 py-4 transition-colors">
    <div class="flex items-center gap-4">
      <h1 class="text-xl font-bold text-white tracking-tight">Transaction History</h1>
    </div>
    <a routerLink="/transactions/add"
       class="flex items-center justify-center size-10 rounded-full hover:bg-slate-800 text-slate-300 transition-colors">
      <span class="material-symbols-outlined" style="font-size: 24px;">add_circle</span>
    </a>
  </header>

  <div class="px-6 py-6 overflow-x-auto no-scrollbar">
    <div class="flex gap-3 min-w-max">
      <button
        class="flex h-10 items-center justify-center px-6 rounded-full bg-blue-500 text-white font-semibold text-sm shadow-md shadow-blue-900/10 transition-transform active:scale-95">
        All
      </button>
      <button
        class="flex h-10 items-center justify-center px-6 rounded-full bg-[#1e293b] border border-slate-700 text-slate-300 font-medium text-sm hover:bg-slate-700 transition-colors">
        Deposit
      </button>
      <button
        class="flex h-10 items-center justify-center px-6 rounded-full bg-[#1e293b] border border-slate-700 text-slate-300 font-medium text-sm hover:bg-slate-700 transition-colors">
        Withdrawal
      </button>
    </div>
  </div>

  <div class="flex-1 flex flex-col px-6 pb-12 space-y-8">
    <div class="flex flex-col gap-4">
      <h4 class="text-blue-400 font-bold text-sm tracking-widest uppercase opacity-90 pl-1">Today</h4>
      <!-- Item 1 -->
      <div
        class="flex items-center justify-between p-5 rounded-2xl bg-[#1e293b] border border-slate-800 shadow-sm hover:shadow-md hover:border-blue-500/30 transition-all cursor-pointer group">
        <div class="flex items-center gap-5">
          <div
            class="size-14 rounded-full bg-blue-900/20 flex items-center justify-center text-blue-400 group-hover:bg-blue-500 group-hover:text-[#0b1121] transition-colors shrink-0">
            <span class="material-symbols-outlined" style="font-size: 28px;">account_balance_wallet</span>
          </div>
          <div class="flex flex-col gap-1">
            <p class="text-white font-bold text-lg">Bank Deposit</p>
            <div class="flex items-center gap-2">
              <span
                class="text-xs font-semibold px-2.5 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400">Success</span>
              <span class="text-slate-400 text-xs font-medium">14:30 • ID: 882910</span>
            </div>
          </div>
        </div>
        <div class="text-right">
          <p class="text-emerald-400 font-bold text-lg">+5,000,000 ₫</p>
        </div>
      </div>
    </div>

    <div class="flex flex-col gap-4">
      <h4 class="text-slate-400 font-bold text-sm tracking-widest uppercase pl-1">Yesterday</h4>
      <!-- Item 2 -->
      <div
        class="flex items-center justify-between p-5 rounded-2xl bg-[#1e293b] border border-slate-800 shadow-sm hover:shadow-md hover:border-blue-500/30 transition-all cursor-pointer group">
        <div class="flex items-center gap-5">
          <div
            class="size-14 rounded-full bg-slate-700/40 flex items-center justify-center text-slate-300 group-hover:bg-[#172554] group-hover:text-white transition-colors shrink-0">
            <span class="material-symbols-outlined" style="font-size: 28px;">payments</span>
          </div>
          <div class="flex flex-col gap-1">
            <p class="text-white font-bold text-lg">Withdraw to Momo Wallet</p>
            <div class="flex items-center gap-2">
              <span
                class="text-xs font-semibold px-2.5 py-0.5 rounded-md bg-amber-500/10 text-amber-400">Processing</span>
              <span class="text-slate-400 text-xs font-medium">18:45 • ID: 661022</span>
            </div>
          </div>
        </div>
        <div class="text-right">
          <p class="text-white font-bold text-lg">-2,000,000 ₫</p>
        </div>
      </div>
    </div>
  </div>
</div>
