application:
  datasource:
    jdbc-url: "jdbc:mysql://${DB_PRIMARY_HOST:localhost}:${DB_PRIMARY_PORT:3310}/${DB_NAME:kira}?useUnicode=true&createDatabaseIfNotExist=true&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true"
    username: "${DB_APP_USER:kira_user}"
    password: "${DB_APP_PASSWORD:kira_password}"
    driver-class-name: com.mysql.cj.jdbc.Driver

spring:
  application:
    name: kira-gateway
  profiles:
    active: composite
  output:
    ansi:
      enabled: NEVER
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 16MB
  task:
    scheduling:
      pool:
        size: 36
    execution:
      pool:
        core-size: 36

app:
  data-manager:
    base-url: ${APP_DATA_MANAGER_BASE_URL:http://localhost/data}
  kira-producer:
    base-url: ${APP_KIRA_PRODUCER_BASE_URL:http://localhost:2311}
  gemini:
    base-url: ${APP_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    model: ${APP_GEMINI_MODEL:gemini-3.1-flash-lite}
    api-key: ${APP_GEMINI_API_KEY:}
    connect-timeout: ${APP_GEMINI_CONNECT_TIMEOUT:5s}
    read-timeout: ${APP_GEMINI_READ_TIMEOUT:30s}
  crawl:
    claim-stale-after-seconds: ${CRAWL_CLAIM_STALE_AFTER_SECONDS:900}
  export:
    kira-crawl:
      enabled: ${APP_EXPORT_KIRA_CRAWL_ENABLED:true}
      source-directory: "${APP_EXPORT_KIRA_CRAWL_SOURCE_DIRECTORY:/Users/kira/Desktop/workspace/kira_app/kira-crawl}"
      include-git: ${APP_EXPORT_KIRA_CRAWL_INCLUDE_GIT:false}
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:change-me-in-production-change-me-in-production}
      issuer: ${APP_SECURITY_JWT_ISSUER:kira-gateway}
      access-token-ttl-seconds: ${APP_SECURITY_JWT_ACCESS_TOKEN_TTL_SECONDS:20000}
    cookie:
      name: ${APP_SECURITY_COOKIE_NAME:access_token}
      secure: ${APP_SECURITY_COOKIE_SECURE:true}
      same-site: ${APP_SECURITY_COOKIE_SAME_SITE:Strict}
      domain: ${APP_SECURITY_COOKIE_DOMAIN:}
      path: ${APP_SECURITY_COOKIE_PATH:/gateway}
      max-age-seconds: ${APP_SECURITY_COOKIE_MAX_AGE_SECONDS:20000}
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    shutdown:
      enabled: false

server:
  port: 6868
  tomcat:
    max-http-form-post-size: 16MB
    max-swallow-size: 16MB
    threads:
      max: 400
      min-spare: 50
    accept-count: 500
    max-connections: 20000
  servlet:
    context-path: /gateway
  compression:
    enabled: true
    min-response-size: 512

logging:
  level:
    root: info
  file:
    name: ${LOG_DIR:./logs}/kira-gateway-${INSTANCE_ID:${HOSTNAME:local}-${server.port}-${PID}}.log
