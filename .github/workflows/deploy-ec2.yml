name: CI/CD Deploy to EC2

on:
  push:
    branches: [main, master]
    paths:
      - "kira-ui/**"
      - "kira-gateway/**"
      - "kira-data-manager/**"
      - "kira-crawl-java/**"
      - "docker-compose*.yml"
      - "scripts/deploy-ec2.sh"
      - "scripts/ec2-bootstrap.sh"
      - ".github/workflows/deploy-ec2.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "kira-ui/**"
      - "kira-gateway/**"
      - "kira-data-manager/**"
      - "kira-crawl-java/**"
  workflow_dispatch:
    inputs:
      force_build_all:
        description: "Build and push all images"
        type: boolean
        default: true
      skip_deploy:
        description: "Skip EC2 deploy step"
        type: boolean
        default: false

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: kira2308
  EC2_APP_DIR: /opt/kira-app

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      kira-ui: ${{ steps.filter.outputs.kira-ui }}
      kira-gateway: ${{ steps.filter.outputs.kira-gateway }}
      kira-data-manager: ${{ steps.filter.outputs.kira-data-manager }}
      kira-crawl-java: ${{ steps.filter.outputs.kira-crawl-java }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            kira-ui:
              - 'kira-ui/**'
            kira-gateway:
              - 'kira-gateway/**'
            kira-data-manager:
              - 'kira-data-manager/**'
            kira-crawl-java:
              - 'kira-crawl-java/**'

  build-kira-ui:
    needs: changes
    if: >-
      needs.changes.outputs.kira-ui == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.force_build_all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./kira-ui
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/kira-ui:latest
            ${{ env.DOCKERHUB_USERNAME }}/kira-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-kira-gateway:
    needs: changes
    if: >-
      needs.changes.outputs.kira-gateway == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.force_build_all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./kira-gateway
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/kira-gateway:latest
            ${{ env.DOCKERHUB_USERNAME }}/kira-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-kira-data-manager:
    needs: changes
    if: >-
      needs.changes.outputs.kira-data-manager == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.force_build_all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./kira-data-manager
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/kira-data-manager:latest
            ${{ env.DOCKERHUB_USERNAME }}/kira-data-manager:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-kira-crawl-java:
    needs: changes
    if: >-
      needs.changes.outputs.kira-crawl-java == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.force_build_all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./kira-crawl-java
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/kira-crawl-java:latest
            ${{ env.DOCKERHUB_USERNAME }}/kira-crawl-java:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs:
      - build-kira-ui
      - build-kira-gateway
      - build-kira-data-manager
      - build-kira-crawl-java
    if: >-
      always()
      && !cancelled()
      && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      && !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy)
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,docker-compose.4-images.yml,docker-compose.crawl.yml,scripts/deploy-ec2.sh,.env.ec2.example"
          target: ${{ env.EC2_APP_DIR }}
          strip_components: 0

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p ${{ env.EC2_APP_DIR }}
            chmod +x ${{ env.EC2_APP_DIR }}/scripts/deploy-ec2.sh
            cd ${{ env.EC2_APP_DIR }}
            if [[ ! -f .env.ec2 ]]; then
              echo "ERROR: .env.ec2 missing on EC2. Copy from .env.ec2.example and configure secrets."
              exit 1
            fi
            ./scripts/deploy-ec2.sh
