name: CI/CD kira-memory

on:
  push:
    branches: [master]
    paths: ['kira-memory/**', '.github/workflows/deploy-kira-memory.yml']
  pull_request:
    paths: ['kira-memory/**', '.github/workflows/deploy-kira-memory.yml']
  workflow_dispatch:

concurrency:
  group: deploy-kira-memory-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: kira2308

jobs:
  test-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kira-memory/kira-memory-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Unit + Testcontainers integration tests (MySQL, S3Mock, Hugging Face stub).
      - run: mvn -B -q verify

  test-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kira-memory/kira-memory-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: kira-memory/kira-memory-ui/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false

  build:
    needs: [test-service, test-ui]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [kira-memory-service, kira-memory-ui]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./kira-memory/${{ matrix.image }}
          load: ${{ matrix.image == 'kira-memory-service' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Check the patched JVM
        if: matrix.image == 'kira-memory-service'
        run: python3 scripts/check_java_image.py ${{ env.DOCKERHUB_USERNAME }}/kira-memory-service:${{ github.sha }}

  # Redeploy the existing Portainer stack with image re-pull; stack file and env stay in Portainer.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      PORTAINER_URL: ${{ secrets.KIRA_MEMORY_PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.KIRA_MEMORY_PORTAINER_API_KEY }}
      STACK_ID: ${{ secrets.KIRA_MEMORY_PORTAINER_STACK_ID }}
      ENDPOINT_ID: ${{ secrets.KIRA_MEMORY_PORTAINER_ENDPOINT_ID }}
    steps:
      - name: Redeploy Portainer stack
        run: |
          set -euo pipefail
          if [ -z "${PORTAINER_URL:-}" ]; then echo "Portainer secrets not set; images are pushed, skipping redeploy"; exit 0; fi
          api() { curl -fsS --max-time 600 -H "X-API-Key: $PORTAINER_API_KEY" "$@"; }
          env_json=$(api "$PORTAINER_URL/api/stacks/$STACK_ID" | jq '.Env // []')
          file=$(api "$PORTAINER_URL/api/stacks/$STACK_ID/file" | jq -r '.StackFileContent')
          jq -n --arg f "$file" --argjson e "$env_json" \
            '{stackFileContent: $f, env: $e, prune: false, pullImage: true}' \
          | api -X PUT -H "Content-Type: application/json" --data @- \
              "$PORTAINER_URL/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" >/dev/null
          echo "kira-memory stack $STACK_ID redeployed"
