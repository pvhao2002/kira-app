name: CI/CD know-stack

on:
  push:
    branches: [main, master]
    paths:
      - "know-stack/**"
      - ".github/workflows/know-stack.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "know-stack/**"
  workflow_dispatch:

concurrency:
  group: know-stack-${{ github.ref }}
  # Never cancel a deploy halfway through its D1 migrations.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: know-stack

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: know-stack/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc -b
      - run: npx vite build

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: know-stack/package-lock.json
      - run: npm ci
      - name: Require a real D1 database id
        run: |
          if grep -q REPLACE_WITH_D1_ID wrangler.jsonc; then
            echo "::error::Set database_id in know-stack/wrangler.jsonc (npx wrangler d1 create knowstack)"; exit 1
          fi
      # Migrations are additive, so applying them before the new code ships keeps the old Worker working.
      - run: npx wrangler d1 migrations apply knowstack --remote
      - run: npm run deploy
