name: CI/CD kira-ui

on:
  push:
    branches: [main, master]
    paths:
      - "kira-ui/**"
      - ".github/workflows/deploy-kira-ui.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "kira-ui/**"
  workflow_dispatch:

concurrency:
  group: deploy-kira-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: kira2308

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Dockerfile runs `npm ci` + production `ng build`, so a PR build is the CI check.
      - uses: docker/build-push-action@v6
        with:
          context: ./kira-ui
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/kira-ui:latest
            ${{ env.DOCKERHUB_USERNAME }}/kira-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            IMAGE=kira2308/kira-ui:${{ github.sha }}
            docker pull "$IMAGE"
            docker rm -f kira-ui 2>/dev/null || true
            docker run -d --name kira-ui --restart unless-stopped \
              -p 4200:80 --memory 256m "$IMAGE"
            docker image prune -f
            for i in $(seq 1 10); do
              curl -fsS http://127.0.0.1:4200/health >/dev/null && echo "kira-ui: ok" && exit 0
              sleep 3
            done
            echo "kira-ui: health check FAIL" && exit 1
