name: farm-admin-desktop

on:
  workflow_dispatch:
  push:
    tags: ['farm-admin-v*']

concurrency:
  group: farm-admin-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # tauri-action creates/uploads the draft release on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # universal binary: Apple Silicon + Intel
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: farm-market/farm-market-admin-desktop
    env:
      FARM_ADMIN_URL: ${{ vars.FARM_ADMIN_URL }}
    steps:
      # Without this, main.rs silently falls back to the offline page and ships useless installers.
      - name: Require FARM_ADMIN_URL
        shell: bash
        run: '[[ "$FARM_ADMIN_URL" =~ ^https:// ]] || { echo "::error::vars.FARM_ADMIN_URL must be set (https)"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farm-market/farm-market-admin-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: farm-market/farm-market-admin-desktop/src-tauri -> target
      - name: Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: farm-market/farm-market-admin-desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: true
          args: ${{ matrix.args }}
      # Manual runs have no tag/release, so publish the installers as workflow artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: farm-admin-${{ matrix.os }}
          path: farm-market/farm-market-admin-desktop/src-tauri/target/**/release/bundle/**
          if-no-files-found: error
