name: kira-affilate

on:
  push:
    branches: [master]
    paths: ['kira-affilate/**', '.github/workflows/kira-affilate.yml']
  pull_request:
    paths: ['kira-affilate/**', '.github/workflows/kira-affilate.yml']

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kira-affilate/kira-affilate-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Unit tests + Testcontainers integration tests (Docker is available on the runner).
      - run: mvn -B -q verify

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kira-affilate/kira-affilate-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: kira-affilate/kira-affilate-ui/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
