services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kira_bank}
      MYSQL_USER: ${MYSQL_USER:-kira_bank}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
    volumes: [kira-bank-mysql:/var/lib/mysql]
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-p${MYSQL_ROOT_PASSWORD:-change-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 12
  kira-bank-service:
    build: ./kira-bank-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-kira_bank}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-kira_bank}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-development-secret-must-have-at-least-32-characters}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      R2_STORAGE_ENVIRONMENT: ${R2_STORAGE_ENVIRONMENT:-LOCAL}
      R2_FREE_GB: ${R2_FREE_GB:-10}
      HF_STORAGE_NAMESPACE: ${HF_STORAGE_NAMESPACE:-}
      HF_STORAGE_BUCKET: ${HF_STORAGE_BUCKET:-}
      HF_S3_ACCESS_KEY_ID: ${HF_S3_ACCESS_KEY_ID:-}
      HF_S3_SECRET_ACCESS_KEY: ${HF_S3_SECRET_ACCESS_KEY:-}
      HF_FREE_GB: ${HF_FREE_GB:-100}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      LOGIN_VISIT_TRUSTED_PROXIES: ${LOGIN_VISIT_TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:-}
      INVESTMENT_CREDENTIAL_ENCRYPTION_KEY: ${INVESTMENT_CREDENTIAL_ENCRYPTION_KEY:-}
    depends_on:
      mysql: {condition: service_healthy}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8080/actuator/health | grep UP"]
      interval: 15s
      timeout: 5s
      retries: 10
  kira-bank-ui:
    build: ./kira-bank-ui
    depends_on:
      kira-bank-service: {condition: service_healthy}
    ports: ["4200:80"]
volumes:
  kira-bank-mysql:
