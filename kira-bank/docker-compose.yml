services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kira_bank}
      MYSQL_USER: ${MYSQL_USER:-kira_bank}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
    volumes: [kira-bank-mysql:/var/lib/mysql]
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-p${MYSQL_ROOT_PASSWORD:-change-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 12
  kira-bank-service:
    build: ./kira-bank-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-kira_bank}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-kira_bank}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-development-secret-must-have-at-least-32-characters}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-kira-bank-attachments}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.cloudflare.com/client/v4/accounts}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AI_API_TOKEN: ${CLOUDFLARE_AI_API_TOKEN:-}
      AI_MODEL: ${AI_MODEL:-@cf/moonshotai/kimi-k2.7-code}
    depends_on:
      mysql: {condition: service_healthy}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8080/actuator/health | grep UP"]
      interval: 15s
      timeout: 5s
      retries: 10
  kira-bank-ui:
    build: ./kira-bank-ui
    depends_on:
      kira-bank-service: {condition: service_healthy}
    ports: ["4200:80"]
volumes:
  kira-bank-mysql:

