# Host Nginx on EC2 — reverse proxy cho kira-ui, kira-gateway, kira-data-manager
# Copy: sudo cp scripts/nginx-kira.conf /etc/nginx/conf.d/kira.conf
# Test:  sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare SSL: Flexible (Nginx chỉ listen 80)
# Containers: kira-ui :4200 | kira-gateway :6868 | kira-data-manager :7777

upstream kira_ui {
    server 127.0.0.1:4200;
    keepalive 16;
}

upstream kira_gateway {
    server 127.0.0.1:6868;
    keepalive 16;
}

upstream kira_data_manager {
    server 127.0.0.1:7777;
    keepalive 16;
}

server {
    listen 80;
    server_name kira.id.vn www.kira.id.vn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # --- kira-gateway (Spring context-path: /gateway) ---
    location = /gateway {
        return 301 /gateway/;
    }

    location /gateway/ {
        proxy_pass http://kira_gateway;
    }

    # --- kira-data-manager (Spring context-path: /data) ---
    location = /data {
        return 301 /data/;
    }

    location /data/ {
        proxy_pass http://kira_data_manager;
    }

    # --- kira-ui (Angular SPA) ---
    location / {
        proxy_pass http://kira_ui;
        proxy_set_header Connection "";
    }
}
