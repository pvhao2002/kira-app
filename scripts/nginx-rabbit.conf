# Host Nginx on EC2 — reverse proxy RabbitMQ Management UI
# Copy: sudo cp scripts/nginx-rabbit.conf /etc/nginx/conf.d/rabbit.conf
# Test:  sudo nginx -t && sudo systemctl reload nginx
#
# RabbitMQ: HTTP (non-TLS) http://127.0.0.1:15672
# Cloudflare Flexible: dùng X-Forwarded-Proto https (không dùng $scheme)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name rabbit.kira.id.vn;

    location / {
        proxy_pass http://127.0.0.1:15672;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
