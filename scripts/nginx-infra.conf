# Host Nginx on EC2 — reverse proxy Portainer + RabbitMQ Management UI
# Copy: sudo rm -f /etc/nginx/conf.d/default.conf
# Copy: sudo cp scripts/nginx-infra.conf /etc/nginx/conf.d/kira-infra.conf
# Test:  sudo nginx -t && sudo systemctl reload nginx
#
# Domains (Cloudflare DNS A → EC2 public IP):
#   portainer.kira.id.vn → https://127.0.0.1:9443 (Portainer CE, self-signed)
#   rabbit.kira.id.vn    → http://127.0.0.1:15672 (RabbitMQ Management)
#
# Cloudflare SSL: Flexible (Nginx chỉ listen 80; set X-Forwarded-Proto https)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Health qua IP public (debug Cloudflare 522 — nếu curl IP:80/healthz OK mà subdomain vẫn 522 thì lỗi DNS)
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "nginx ok\n";
    }

    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name portainer.kira.id.vn;

    location / {
        proxy_pass https://127.0.0.1:9443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name rabbit.kira.id.vn;

    location / {
        proxy_pass http://127.0.0.1:15672;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
