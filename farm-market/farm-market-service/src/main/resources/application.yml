spring:
  application:
    name: farm-market-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  # Tomcat request threads and @Async/scheduling run on virtual threads: blocking JDBC waits are cheap, so the
  # real concurrency limit is the Hikari pool below (not a thread count).
  threads.virtual.enabled: true
  # Image uploads: MediaService enforces app.media.max-bytes; these cap the request before it is buffered.
  servlet.multipart:
    max-file-size: 5MB
    max-request-size: 6MB
  # Let in-flight requests finish on SIGTERM (rolling deploys) before the context closes.
  lifecycle.timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/farm_market?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:farm_market}
    password: ${DB_PASSWORD:change-me}
    hikari:
      # Bounded on purpose: with virtual threads an unbounded pool would just move the queue into MySQL.
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}   # fail fast with 5xx instead of hanging 30s
      validation-timeout: 3000
      idle-timeout: 600000
      # Must stay below MySQL wait_timeout (default 8h) and any proxy/firewall idle cut-off.
      max-lifetime: ${DB_MAX_LIFETIME_MS:1740000}
      # 0 = off. Set e.g. DB_LEAK_DETECTION_MS=20000 while hunting a connection leak.
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:0}
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        rewriteBatchedStatements: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      # Insert/update batching (note: IDENTITY ids still disable insert batching for those entities).
      hibernate.jdbc.batch_size: ${HIBERNATE_BATCH_SIZE:50}
      hibernate.order_inserts: true
      hibernate.order_updates: true
      # Lazy proxies/collections of a result page load with one IN query per 32 ids instead of one query each.
      hibernate.default_batch_fetch_size: ${HIBERNATE_FETCH_BATCH_SIZE:32}
      hibernate.query.in_clause_parameter_padding: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
  data.web.pageable.max-page-size: 100
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: ${HTTP_COMPRESSION:true}
    mime-types: application/json,application/problem+json
    min-response-size: 1KB
  tomcat:
    # Request threads are virtual (see spring.threads.virtual), so threads.max is not the limit; these are.
    max-connections: ${TOMCAT_MAX_CONNECTIONS:4096}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    connection-timeout: 20s
    keep-alive-timeout: 30s
    max-keep-alive-requests: 200
    # Drain an over-limit upload (multipart max-request-size is 6MB) so the client reads a clean 413 instead of a reset.
    max-swallow-size: 8MB
    mbeanregistry.enabled: true   # Tomcat session/thread/connection metrics in /actuator/metrics
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    include-path: always
    whitelabel.enabled: false
management:
  # health is public (probes); every other actuator endpoint, metrics included, is ADMIN-only (SecurityConfig).
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health:
    show-details: never
    show-components: never
    probes.enabled: true   # /actuator/health/liveness and /readiness
    group:
      liveness.include: livenessState
      readiness.include: readinessState,db
  metrics.tags.application: ${spring.application.name}
app:
  jwt:
    secret: ${JWT_SECRET:development-secret-must-have-at-least-32-characters}
    access-ttl: PT15M
    refresh-ttl: P30D
  # AES-GCM key (>= 32 chars) for TOTP secrets at rest. Set TOTP_ENCRYPTION_KEY outside development.
  totp-encryption-key: ${TOTP_ENCRYPTION_KEY:development-totp-key-must-be-at-least-32-chars}
  # Public base URL of the web app, used for links in emails (password reset). MUST be set via APP_PUBLIC_URL outside
  # development, otherwise reset links point at localhost.
  public-url: ${APP_PUBLIC_URL:http://localhost:4201}
  # Forgot-password token lifetime (single use, only its SHA-256 is stored).
  password-reset:
    ttl: ${APP_PASSWORD_RESET_TTL:PT30M}
  # Image uploads on local disk (mount a volume at APP_UPLOAD_DIR). One instance only until moved to object storage.
  media:
    dir: ${APP_UPLOAD_DIR:./uploads}
    # Keep in step with spring.servlet.multipart.max-file-size (5MB): multipart rejects first, so raise both together.
    max-bytes: 5242880
    public-base-url: ${APP_MEDIA_PUBLIC_BASE_URL:}
  # Comma-separated exact origins (scheme://host[:port]). No wildcards.
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4201}
  # Dev only: demo users + demo catalogue. Must be false in production.
  seed-development-users: ${APP_SEED_DEVELOPMENT_USERS:false}
  seed-development-password: ${APP_SEED_DEVELOPMENT_PASSWORD:KiraFarm@123}
  # Dev only: shared base32 TOTP secret enrolled for the seeded staff/manager/admin users.
  seed-development-totp-secret: ${APP_SEED_DEVELOPMENT_TOTP_SECRET:JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP}
  # First admin for a fresh install (independent of the dev seed). Both email and password (>= 12 chars) must be set;
  # created only when no admin exists yet, never overwrites a user. The admin enrolls TOTP at first login.
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${APP_BOOTSTRAP_ADMIN_NAME:}
  refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
  # Business decisions: edit here, not in code. type: PERCENT (value = %), FIXED (value = VND) or FREE_SHIP.
  loyalty:
    rewards:
      - {id: voucher-20k, name: "Voucher giảm 20.000₫", description: "Giảm 20.000₫ cho đơn từ 100.000₫", points-cost: 200, type: FIXED, value: 20000, min-order: 100000, valid-days: 60}
      - {id: freeship, name: "Miễn phí vận chuyển", description: "Miễn phí vận chuyển cho một đơn hàng", points-cost: 300, type: FREE_SHIP, value: 0, min-order: 0, valid-days: 60}
      - {id: voucher-50k, name: "Voucher giảm 50.000₫", description: "Giảm 50.000₫ cho đơn từ 300.000₫", points-cost: 450, type: FIXED, value: 50000, min-order: 300000, valid-days: 60}
      - {id: egg-box, name: "Tặng 1 hộp trứng", description: "Quy đổi thành voucher 35.000₫ (giá một hộp trứng)", points-cost: 500, type: FIXED, value: 35000, min-order: 0, valid-days: 30}
  # Bank transfer (VietQR image, no gateway). QR/bank details are shown only when bin, account-no and account-name are all set.
  payment:
    bank:
      bin: ${VIETQR_BANK_BIN:}
      bank-code: ${BANK_CODE:}
      name: ${BANK_NAME:}
      account-no: ${BANK_ACCOUNT_NO:}
      account-name: ${BANK_ACCOUNT_NAME:}
storage:
  environment: ${R2_STORAGE_ENVIRONMENT:LOCAL}
springdoc:
  api-docs.enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
