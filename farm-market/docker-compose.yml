# Local runtime only. Ports are offset from kira-bank (3307/8080/4200) so both stacks can run together.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-farm_market}
      MYSQL_USER: ${MYSQL_USER:-farm_market}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
    volumes: [farm-market-mysql:/var/lib/mysql]
    ports: ["3308:3306"]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-p${MYSQL_ROOT_PASSWORD:-change-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 12
  farm-market-service:
    build: ./farm-market-service   # not created yet
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-farm_market}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-farm_market}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-development-secret-must-have-at-least-32-characters}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4201}
      VIETQR_BANK_BIN: ${VIETQR_BANK_BIN:-}
      BANK_CODE: ${BANK_CODE:-}
      BANK_NAME: ${BANK_NAME:-}
      BANK_ACCOUNT_NO: ${BANK_ACCOUNT_NO:-}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-}
      APP_UPLOAD_DIR: /data/uploads   # fixed: must match the volume mount below
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4201}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_BOOTSTRAP_ADMIN_NAME: ${APP_BOOTSTRAP_ADMIN_NAME:-}
      APP_PASSWORD_RESET_TTL: ${APP_PASSWORD_RESET_TTL:-PT30M}
      APP_MEDIA_PUBLIC_BASE_URL: ${APP_MEDIA_PUBLIC_BASE_URL:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    volumes: [farm-market-uploads:/data/uploads]   # uploaded images; one instance only (local disk)
    depends_on:
      mysql: {condition: service_healthy}
    ports: ["8081:8080"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8080/actuator/health | grep UP"]
      interval: 15s
      timeout: 5s
      retries: 10
  farm-market-ui:
    build: ./farm-market-ui   # not created yet
    depends_on:
      farm-market-service: {condition: service_healthy}
    ports: ["4201:80"]
volumes:
  farm-market-mysql:
  farm-market-uploads:
