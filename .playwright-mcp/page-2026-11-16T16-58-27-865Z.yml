            - listitem [ref=f22e254]:
              - paragraph [ref=f22e255]:
                - generic [ref=f22e256]:
                  - text: "Đối tác tham gia chương trình Shopee Tiếp thị Liên kết với hình thức Doanh Nghiệp: Đối tác sẽ được thanh toán với tần suất 01 lần mỗi tháng"
                  - generic [ref=f22e257]: . Tùy thuộc vào số ngày trong tháng, có thể sẽ có 08 đến 09 “Bảng kê thanh toán” được tạo ra trong kỳ thanh toán tương ứng. Mỗi đợt thanh toán sẽ thực hiện gộp thanh toán cho toàn bộ các “Bảng kê thanh toán” liền kề trong cùng tháng đó.
            - listitem [ref=f22e258]:
              - paragraph [ref=f22e259]: Trong vòng 10 Ngày Làm Việc sau ngày bảng kê cuối của kỳ thanh toán được xuất, Shopee sẽ gửi email đối soát về doanh thu mà Quý Đối tác có thể được nhận.
          - paragraph [ref=f22e260]: Để làm rõ, Ngày Làm Việc có nghĩa là bất kỳ ngày nào trong tuần không bao gồm thứ Bảy, Chủ Nhật, và các ngày nghỉ Lễ/Tết theo quy định của pháp luật hiện hành.
          - list [ref=f22e261]:
            - listitem [ref=f22e262]:
              - paragraph [ref=f22e263]: Quý Đối tác sẽ kiểm tra các loại doanh thu được ghi nhận tại email đối soát được quy định tại đoạn liền kề bên trên và phản hồi cho Shopee (nếu có thắc mắc) trong thời hạn được quy định một cách rõ ràng trong email đối soát. Sau đó, Quý Đối tác sẽ gửi bộ chứng từ theo hướng dẫn từ phía Shopee đề cập trong email đối soát.
          - paragraph [ref=f22e264]: Việc Quý Đối tác không đưa ra bất kỳ thắc mắc hoặc phản hồi nào trước thời hạn nêu trên, đồng nghĩa với việc Quý Đối tác hiểu rõ và đồng ý rằng các loại doanh thu được ghi nhận là hoàn toàn chính xác và không có bất kỳ phản đối nào (bất kể trực tiếp hoặc gián tiếp, rõ ràng hoặc ngụ ý). Tuy nhiên việc thanh toán bởi Shopee cho Quý Đối tác đối với các loại doanh thu tương ứng sẽ chỉ được thực hiện dựa trên các nguyên tắc và quy định hiện hành (bao gồm nhưng không giới hạn ở nghĩa vụ cung cấp chứng từ thanh toán theo hướng dẫn của Shopee).
          - list [ref=f22e265]:
            - listitem [ref=f22e266]:
              - paragraph [ref=f22e267]: Thời gian gửi email đối soát có thể bị thay đổi tùy theo tình hình vận hành của Shopee. Trong trường hợp Ngày dự kiến thanh toán trùng với Ngày Lễ hoặc Tết theo quy định của pháp luật, Shopee sẽ thực hiện các công việc liên quan vào Ngày Làm Việc kế tiếp; do đó, thời gian gửi email thực tế có thể kéo dài hơn so với dự kiến.
          - generic:
            - strong
          - paragraph [ref=f22e268]: "Một vài lưu ý quan trọng:"
