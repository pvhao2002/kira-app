          - paragraph [ref=f1e90]:
            - text: Two-Phase Commit guarantees ACID across stores at the cost of synchronous locking, cascading latency and a single coordinator.
            - strong [ref=f1e91]: Sagas replace one atomic transaction with a sequence of local transactions
            - text: ", each with a compensating action, and accept eventual consistency to stay available."
          - heading "01 The dual-write problem and the death of 2PC" [level=2] [ref=f1e92]
          - paragraph [ref=f1e93]: Updating Postgres and publishing to Kafka "together" is not atomic. If the commit succeeds and the publish fails, downstream services never hear about it; publish first and a crash leaves an event for state that never existed.
          - blockquote [ref=f1e94]:
            - generic [ref=f1e95]:
              - generic [ref=f1e96]: report_problem
              - text: Anti-pattern
            - paragraph [ref=f1e97]: XA / 2PC across cloud microservices. Every participant holds row locks through the prepare phase; one slow node starves connection pools across the fleet.
          - paragraph [ref=f1e98]:
            - text: The fix is the
            - strong [ref=f1e99]: transactional outbox
            - text: ": write the event to an"
            - code [ref=f1e100]: outbox
            - text: table in the same local transaction, and let a relay (polling or CDC like Debezium) publish it.
          - heading "02 Forward path vs compensation path" [level=2] [ref=f1e101]
