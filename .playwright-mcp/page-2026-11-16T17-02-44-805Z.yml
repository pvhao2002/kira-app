          - list [ref=f34e824]:
            - listitem [ref=f34e825]:
              - paragraph [ref=f34e826]: Người Bán Tiếp Thị Liên Kết bao gồm (i) cá nhân kinh doanh, hộ kinh doanh đăng ký và thành lập hợp pháp theo quy định của pháp luật Việt Nam. Theo đó, Người Bán Tiếp Thị Liên Kết (ii) phải là cá nhân, hộ kinh doanh có đăng ký ngành nghề quảng cáo trong phạm vi hoạt động của Người Bán Tiếp Thị Liên Kết.
            - listitem [ref=f34e827]:
