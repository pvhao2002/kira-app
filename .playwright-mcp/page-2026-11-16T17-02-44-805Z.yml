      - generic [ref=f34e104]:
        - heading "ĐIỀU KHOẢN VÀ ĐIỀU KIỆN CHƯƠNG TRÌNH TIẾP THỊ LIÊN KẾT" [level=2] [ref=f34e105]
        - generic [ref=f34e106]:
          - generic [ref=f34e107]: Chương Trình Tiếp Thị Liên Kết Shopee là chương trình mà, Cá Nhân Kinh Doanh, Hộ Kinh Doanh và Doanh Nghiệp khi đăng ký tham gia thành công (“Đối Tác TTLK”) có thể đăng ký tài khoản để tự mình thực hiện hoạt động giới thiệu, cung ứng dịch vụ và/hoặc hợp tác với Shopee và/hoặc các Bên thứ ba để giới thiệu, cung ứng dịch vụ và nhận được một khoản phí và/hoặc Phí Hoa Hồng (như được định nghĩa dưới đây) từ Shopee, Người Bán trên Sàn TMĐT Shopee và/hoặc các bên khác cho các Đơn Hàng Thành Công (như được định nghĩa dưới đây) trên Sàn TMĐT (như được định nghĩa dưới đây) thông qua các Siêu Liên Kết (như được định nghĩa dưới đây). Nếu bạn là một Đối Tác TTLK, bạn được xem như là đã đồng ý với các điều khoản và điều kiện quy định tại đây (bao gồm các sửa đổi và bổ sung vào từng thời điểm cụ thể theo quyết định của Shopee) khi đăng ký tham gia vào Chương Trình TTLK và/hoặc khi bạn tiếp tục sử dụng Sàn TMĐT.
          - paragraph [ref=f34e108]: Điều Khoản và Điều Kiện này là một phần không tách rời của Điều Khoản Dịch Vụ Shopee và các Chính Sách Shopee khác - vui lòng đọc Điều Khoản Dịch Vụ và các Chính Sách Shopee (như được định nghĩa dưới đây) công khai trên Sàn TMĐT Shopee có các tài liệu và chính sách này có chứa các thông tin quan trọng liên quan đến quyền và nghĩa vụ của bạn. Bất kỳ điều khoản và điều kiện nào được sử dụng tại Điều Khoản và Điều Kiện này sẽ có nghĩa như được quy định tại Điều Khoản Dịch Vụ và/hoặc các Chính Sách Shopee áp dụng. Tất cả các điều khoản và điều kiện được quy định tại Điều Khoản và Điều Kiện này có thể được điều chỉnh theo quyết định của Shopee theo các nguyên tắc quy định tại Điều Khoản Dịch Vụ.
          - paragraph [ref=f34e109]: Điều Khoản và Điều Kiện này là một thỏa thuận ràng buộc về mặt pháp lý giữa bạn và Shopee. Nếu bạn dưới 18 tuổi hoặc chưa đủ tuổi hợp pháp để đồng ý Điều Khoản và Điều Kiện này, bạn phải được sự cho phép của cha mẹ hoặc người giám hộ hợp pháp để tham gia Chương Trình và cha mẹ hoặc người giám hộ hợp pháp của bạn phải đồng ý với Điều Khoản và Điều Kiện này. Vui lòng đảm bảo cha mẹ hoặc người giám hộ hợp pháp của bạn đã xem xét và đồng ý với Điều Khoản và Điều Kiện này cũng như các Chính Sách Shopee trước khi truy cập hoặc sử dụng hoặc tham gia Chương Trình. Nếu bạn là cha mẹ hoặc người giám hộ hợp pháp của trẻ vị thành niên đồng ý với Điều Khoản và Điều Kiện này, bạn phải chấp nhận các điều khoản của Điều Khoản và Điều Kiện này thay mặt cho trẻ và bạn sẽ chịu trách nhiệm cho mọi hoạt động truy cập, sử dụng, tham gia Chương Trình bằng tài khoản của trẻ, cho dù tài khoản đó hiện đang mở hay được tạo sau này.
          - paragraph [ref=f34e110]: Để làm rõ và nhằm mục đích của Điều Khoản và Điều Kiện này, trường hợp Đối Tác TTLK là doanh nghiệp và/hoặc tổ chức, hành vi của bất kỳ bên nào có thể được diễn giải (trực tiếp hoặc gián tiếp, rõ ràng hoặc ngụ ý) là hành động theo sự ủy quyền, chỉ đạo hoặc theo một thỏa thuận với Đối Tác TTLK (bao gồm nhưng không giới hạn ở quan hệ người quản lý, lao động, đại lý, nhà thầu của Đối Tác TTLK) sẽ được xem như thể là hành vi của Đối Tác TTLK và Đối Tác TTLK sẽ chịu trách nhiệm cho các hành vi này theo Điều Khoản và Điều Kiện, và pháp luật áp dụng.
