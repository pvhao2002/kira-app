            - listitem [ref=f34e850]:
              - paragraph [ref=f34e851]: Shopee sẽ gửi mail xác nhận xét duyệt tài khoản thành công với loại hình Seller Affiliate tương ứng, sau đó Đối Tác TTLK có thể tham gia Chương Trình dưới hình thức tiến hành đăng bài với Siêu Liên Kết.
            - listitem [ref=f34e852]:
              - paragraph [ref=f34e853]: Trong mọi trường hợp, quyết định cuối cùng về việc xem xét liệu Đối Tác TTLK có đủ điều kiện hoặc không đủ điều kiện tham gia Seller Affiliate thuộc về Shopee.
          - paragraph [ref=f34e854]: "Lưu ý: Shopee tiến hành kiểm duyệt Tài Khoản TTLK của Đối Tác TTLK mỗi tháng. Trường hợp Tài Khoản TTLK vi phạm một trong các điều kiện và điều khoản của Chương Trình TTLK, Shopee có quyền thay đổi trạng thái Tài khoản TTLK để phù hợp với chính sách của Chương Trình TTLK."
