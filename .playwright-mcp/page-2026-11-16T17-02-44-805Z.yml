              - heading "Điều kiện tham gia Chương Trình" [level=3] [ref=f34e865]
          - list [ref=f34e866]:
            - listitem [ref=f34e867]:
              - paragraph [ref=f34e868]: Mạng Xã Hội và Phương Tiện TTLK của Đối Tác TTLK phải được đăng tải công khai và truy cập được thông qua thông tin được cung cấp ở đơn đăng ký tham gia Chương Trình của Đối Tác TTLK. Đối Tác TTLK sẽ không đủ điều kiện tham gia, và Shopee có thể hủy việc tham gia Chương Trình của Đối Tác TTLK nếu Phương Tiện TTLK có chứa bất kỳ Nội Dung Cấm hoặc nội dung khác mà Shopee cho là không phù hợp.
            - listitem [ref=f34e869]:
              - paragraph [ref=f34e870]: Mạng Xã Hội của Đối Tác TTLK phải (i) không chứa nhãn hiệu, tên, hoặc logo của Shopee, hoặc thể hiện thông tin gây hiểu lầm, và (ii) nếu thông qua Facebook, chỉ được thể thiện thông qua một “fan page” và không thông qua “trang cá nhân”, đồng thời đảm bảo tuân thủ chính sách áp dụng cho người dùng của Facebook.
          - list [ref=f34e871]:
            - listitem [ref=f34e872]:
              - heading "Phí Hoa Hồng Và Điều Khoản Thanh Toán" [level=3] [ref=f34e873]
          - list [ref=f34e874]:
            - listitem [ref=f34e875]:
              - paragraph [ref=f34e876]: Phí Hoa Hồng. Các loại phí mà Shopee sẽ chi trả cho Đối Tác TTLK trong một tháng bất kỳ sẽ được tính theo mức được thể hiện ở các trang thông tin của Chương Trình hoặc theo thỏa thuận riêng bằng văn bản giữa Đối Tác TTLK và Shopee.
            - listitem [ref=f34e877]:
              - paragraph [ref=f34e878]: Cách Tính Phí Hoa Hồng. Phí Hoa Hồng cho một tháng bất kỳ sẽ được tính dựa trên (i) Ngân Sách Được Thông Qua; hoặc (ii) Giá Trị Giao Dịch Thành Công Thuần nhân với tỷ lệ hoa hồng tương ứng, tùy trường hợp nào nhỏ hơn. Nhằm mục đích của điều khoản này, Ngân Sách Được Thông Qua nghĩa là giá trị truyền thông dự chi được thông qua giữa Shopee và Đối Tác TTLK theo định kỳ hàng tháng bằng email hoặc phương thức khác theo thỏa thuận bằng văn bản giữa Đối Tác TTLK và Shopee.
            - listitem [ref=f34e879]:
              - paragraph [ref=f34e880]: Phí Hoa Hồng cho Đối Tác TTLK là công ty cư trú trong lãnh thổ Việt Nam chưa bao gồm thuế GTGT. Shopee thực hiện chi trả phí hoa hồng khi Đối Tác là Công ty trong nước xuất đầy đủ hóa đơn GTGT hợp lệ theo quy định.
            - listitem [ref=f34e881]:
              - paragraph [ref=f34e882]: Phí Hoa Hồng trả cho, và nhận bởi Đối Tác TTLK là công ty không cư trú trong lãnh thổ Việt Nam chưa bao gồm thuế GTGT nhưng đã bao gồm thuế TNDN. Nếu Shopee phải khấu trừ bất kỳ khoản thuế nào từ các khoản tiền phải trả cho Đối Tác TTLK theo quy định của pháp luật Việt Nam, Shopee sẽ khấu trừ khoản tiền thuế vào Phí Hoa Hồng và các khoản phải thanh toán cho Đối Tác TTLK và cung cấp cho Bên Liên Kết tài liệu chứng minh việc khấu trừ/nộp thuế theo yêu cầu (nếu có).
            - listitem [ref=f34e883]:
              - paragraph [ref=f34e884]: Thanh Toán.
          - paragraph [ref=f34e885]: Dự kiến từ ngày 5 đến ngày 15 của tháng T+1 và tùy theo quyết định của Shope vào từng thời điểm, Shopee sẽ gửi email đối soát thông báo tổng Phí Hoa Hồng mà Đối Tác TTLK được duyệt trong tháng T (bao gồm nhưng không giới hạn các khoản như Phí Hoa Hồng Cơ Bản, Phí Hoa Hồng Xtra, phí hoa hồng thưởng hoặc các phí booking khác... đã và sẽ được quy định trong Điều Kiện và Điều Khoản này.
          - paragraph [ref=f34e886]: Dự kiến trong vòng tối thiểu ba mươi (30) Ngày Làm Việc kể từ ngày Shopee nhận đầy đủ chứng từ thanh toán hợp lệ từ đối tác theo quy định tại Chương I Điều 9, Shopee sẽ tiến hành thanh toán tới Đối Tác TTLK theo thông tin đã được cung cấp hợp lệ trước đó cho Shopee bởi Đối Tác TTLK.
          - strong [ref=f34e888]
          - heading "III. CÁC ĐIỀU KHOẢN VÀ ĐIỀU KIỆN RIÊNG CHO TỪNG LOẠI CHƯƠNG TRÌNH THUỘC CHƯƠNG TRÌNH TTLK" [level=1] [ref=f34e889]
          - paragraph [ref=f34e890]: Trong quá trình triển khai Chương Trình TTLK, tùy thuộc vào loại hình hoạt động mà Đối Tác TTLK đã đăng ký thành công với Shopee theo quy định tại Mục II nêu trên, Shopee có thể có các chương trình cụ thể thuộc Chương Trình TTLK sẽ được áp dụng cho Đối Tác TTLK. Cụ thể theo quy định bên dưới.
          - paragraph [ref=f34e891]: Trong trường hợp có sự khác biệt giữa các điều khoản và điều kiện riêng cho từng loại chương trình thuộc Chương Trình TTLK quy định tại đây, các điều khoản và điều kiện quy định tại Chương I và Chương II sẽ được ưu tiên áp dụng.
          - strong [ref=f34e893]
          - heading "ĐIỀU 1. CHƯƠNG TRÌNH SHOPEE KOL BOOKING (PPP)" [level=2] [ref=f34e894]
          - heading "1. Đối Tượng Áp Dụng" [level=3] [ref=f34e895]
          - heading "Chương Trình Shopee KOL Booking (PPP) là chương trình chỉ áp dụng cho Đối Tác TTLK đăng ký tham gia Chương Trình TTLK theo loại hình KOL Affiliate / KOC Affiliate theo quy định tại Mục II – Điều 1; KOL Doanh Nghiệp theo quy định tại Mục II – Điều 2; và MCN theo quy định tại Mục II – Điều 3." [level=3] [ref=f34e896]
          - heading "2. Cách Thức Tham Gia Chương Trình Shopee KOL Booking (PPP)" [level=3] [ref=f34e897]
          - paragraph [ref=f34e898]: "Shopee sẽ gửi email thông báo hợp tác và chi tiết yêu cầu về nội dung công việc, thời gian diễn ra dự án, thời hạn phản hồi về việc chấp nhận hợp tác của Đối Tác TTLK, chi phí chi trả thực nhận (“Chi Phí Hợp Tác”) cho Đối Tác TTLK cho từng Chiến Dịch với tiêu đề: “Thư mời xác nhận KOL tham gia dự án – Chương trình Shopee KOL Booking” (“Email Hợp Tác”)."
          - paragraph [ref=f34e899]: Đối Tác TTLK sẽ xem xét và xác nhận tham gia dự án bằng cách phản hồi bằng email đối với Email Hợp Tác mà Shopee đã gửi (“Email Xác Nhận Hợp Tác”). Email Xác Nhận Hợp Tác này sẽ là một phần không tách rời của Điều Khoản và Điều Kiện này. Đối Tác TTLK đồng ý một cách rõ ràng rằng nếu Shopee không nhận được bất kỳ phản hồi và/hoặc xác nhận nào bằng email từ Đối Tác TTLK trong vòng 3 (ba) ngày kể từ ngày gửi Email Hợp Tác, thì Đối Tác TTLK được xem là đồng ý và chịu sự ràng buộc với toàn bộ nội dung trong Email Hợp Tác như thể Đối Tác TTLK đã gửi Email Xác Nhận Hợp Tác đến cho Shopee như quy định tại đoạn liền kề nêu trên.
          - heading "3. Phạm Vi Công Việc" [level=3] [ref=f34e900]
          - generic [ref=f34e901]:
            - list [ref=f34e902]:
              - listitem [ref=f34e903]:
                - paragraph [ref=f34e904]: Phạm vi công việc của Đối Tác TTLK khi tham gia Chương Trình “Shopee KOL Booking (PPP)” bao gồm, nhưng không giới hạn ở việc Đối Tác TTLK tham gia sản xuất hình ảnh, nội dung, và đăng tải các hình ảnh và nội dung lên Mạng Xã Hội và/hoặc Hệ Thống Affiliate của Đối Tác TTLK dựa trên yêu cầu của Shopee và các bên liên quan thông qua Shopee.
              - listitem [ref=f34e905]:
                - paragraph [ref=f34e906]: Đối Tác TTLK phải chịu trách nhiệm cho việc sản xuất và đăng tải trên Mạng Xã Hội và/hoặc Hệ Thống TTLK của Đối Tác TTLK các hình ảnh và nội dung phù hợp và liên quan đến yêu cầu mà bên phía Shopee và đối tác của Shopee đã đưa ra, cũng như tuân thủ các yêu cầu của Chính Sách Shopee.
            - paragraph [ref=f34e907]: Để làm rõ, Đối Tác TTLK đồng ý và hiểu rằng Shopee được toàn quyền quyết định cung cấp các thông tin, tư liệu, mã khuyến mãi phục vụ cho dự án của Người Bán (“Tài Liệu Cung Cấp”) lên Mạng Xã Hội và/hoặc Hệ Thống TTLK của Đối Tác TTLK và thời gian đăng tải các nội dung đó một cách tương ứng. Đối Tác TTLK không được quyền gỡ bỏ các Tài Liệu Cung Cấp cho dự án theo yêu cầu của Người Bán bất cứ lúc nào kể cả khi đã hoàn tất công việc nêu tại Điều Khoản và Điều Kiện này, hoặc hoàn tất từng dự án cụ thể hoặc chấm dứt Điều Khoản và Điều Kiện này, trừ khi Shopee có yêu cầu cụ thể bằng văn bản.
            - list [ref=f34e908]:
              - listitem [ref=f34e909]:
                - paragraph [ref=f34e910]: Đối Tác TTLK chỉ được phép đưa các Tài Liệu Cung Cấp phục vụ cho dự án của các Người Bán lên Mạng Xã Hội và/hoặc Hệ Thống TTLK của Đối Tác TTLK, với điều kiện những Mạng Xã Hội và/hoặc Hệ Thống TTLK của Đối Tác TTLK này đã được chấp thuận trước bằng văn bản bởi Shopee và các đối tác của Shopee.
          - heading "4. Nghĩa Vụ Và Cam Kết Của Đối Tác TTLK" [level=3] [ref=f34e911]
          - list [ref=f34e912]:
            - listitem [ref=f34e913]:
              - paragraph [ref=f34e914]: Đối Tác TTLK không được sử dụng và/hoặc sửa đổi các Tài Liệu Cung Cấp, cũng như các yêu cầu và thông tin, nội dung quảng cáo được cung cấp từ Shopee mà không có sự đồng ý trước bằng văn bản của Shopee, trừ khi việc cho phép được quy định cụ thể theo các điều khoản của Điều Khoản và Điều Kiện này.
            - listitem [ref=f34e915]:
              - paragraph [ref=f34e916]: Đối Tác TTLK đảm bảo tuân thủ lên bài đúng thời gian đã cam kết theo thông báo bằng văn bản và/hoặc email trước đó của Shopee.
            - listitem [ref=f34e917]:
              - paragraph [ref=f34e918]: Đối Tác TTLK chỉ được dùng các Tài Liệu Cung Cấp, thông tin và nội dung quảng cáo được Shopee cung cấp hoặc định hướng cho mục đích duy nhất là để thực hiện các hoạt động hợp tác theo Chương Trình Shopee KOL Booking (PPP) giữa Đối Tác TTLK và Shopee, và không được đề cập đến bất cứ hoạt động kinh doanh nào khác của Đối Tác TTLK dù là trực tiếp hoặc gián tiếp. Mọi thông tin và nội dung riêng khác của Đối Tác TTLK có đề cập hoặc có liên quan đến Shopee dù theo bất cứ hình thức nào nhưng chưa được sự chấp thuận trước bằng văn bản và/hoặc email bởi Shopee và không liên quan đến việc thực hiện Chương Trình Shopee KOL Booking (PPP) đều bị nghiêm cấm. Nếu Đối Tác TTLK sử dụng các thông tin, nội dung quảng cáo riêng mà có đề cập hoặc có liên quan đến Shopee mà chưa nhận được sự đồng ý bằng văn bản và/hoặc email từ Shopee thì Đối Tác TTLK bị xem là vi phạm nghiêm trọng Điều Khoản và Điều Kiện này.
            - listitem [ref=f34e919]:
              - paragraph [ref=f34e920]: Theo quy định của Shopee cho từng dự án cụ thể, Đối Tác TTLK có nghĩa vụ hoàn trả sản phẩm quảng cáo được Shopee và/hoặc đối tác của Shopee đã gửi đến cho Đối Tác TTLK sau khi hoàn tất Chiến Dịch.
            - listitem [ref=f34e921]:
              - paragraph [ref=f34e922]: "Quy định về việc hoàn trả lại sản phẩm quảng cáo cho Shopee và/hoặc đối tác của Shopee (nếu Shopee hoặc đối tác của Shopee có yêu cầu):"
          - paragraph [ref=f34e923]: (i) Không có bất kỳ quy định nào được hiểu hay diễn giải rằng sản phẩm quảng cáo sẽ được chuyển quyền sở hữu cho Đối Tác TTLK trong quá trình thực hiện Chương Trình “Shopee KOL Booking (PPP). Đối Tác TTLK có nghĩa vụ hoàn trả sản phẩm quảng cáo trong vòng 07 (bảy) ngày sau ngày kết thúc từng chương trình cụ thể;
          - paragraph [ref=f34e924]: (ii) Đối Tác TTLK có nghĩa vụ hoàn trả sản phẩm quảng cáo trực tiếp cho đối tác của Shopee hoặc Shopee nếu có yêu cầu cụ thể từ Shopee;
          - paragraph [ref=f34e925]: (iii) Đối Tác TTLK phải quay video ghi lại quá trình mở sản phẩm quảng cáo và khi đóng gói sản phẩm quảng cáo để hoàn trả cho đối tác của Shopee. Để làm rõ, Shopee được toàn quyền từ chối giải quyết các khiếu nại, khiếu kiện có liên quan trong trường hợp Đối Tác TTLK không thực hiện đúng và đầy đủ các quy định này;
          - paragraph [ref=f34e926]: (iv) Đối Tác TTLK chịu trách nhiệm đối với mọi thiệt hại và/hoặc tổn thất đối với sản phẩm quảng cáo kể từ thời điểm sản phẩm quảng cáo được giao thành công cho Đối Tác TTLK. Để làm rõ, sản phẩm quảng cáo được xác nhận đã giao thành công cho Đối Tác TTLK khi được ghi nhận bởi Shopee và/hoặc đối tác của Shopee và/hoặc bên vận chuyển về việc sản phẩm quảng cáo đã được giao đến địa chỉ mà Đối Tác TTLK đã thông báo để nhận sản phẩm. Trong mọi trường hợp, quyết định của Shopee sẽ là quyết định cuối cùng trong việc xác định một sản phẩm quảng cáo đã được giao thành công cho Đối Tác TTLK.
          - heading "5. Điều Khoản Phạt" [level=3] [ref=f34e927]
          - list [ref=f34e928]:
            - listitem [ref=f34e929]:
              - paragraph [ref=f34e930]: Điều Khoản Phạt
          - paragraph [ref=f34e931]: "Trường hợp Đối Tác TTLK không tuân thủ các quy định về thời gian, sản phẩm, hướng dẫn nội dung và hình ảnh về bài đăng của Shopee hoặc đối tác Shopee; cũng như vi phạm các điều khoản về nghĩa vụ của Đối Tác TTLK đã được quy định tại Điều Khoản và Điều Kiện này, Shopee có quyền áp dụng các chế tài được quy định tại Điều Khoản và Điều Kiện này (bao gồm nhưng không giới hạn ở việc phạt và/hoặc chấm dứt hợp tác) với Đối Tác TTLK có hành vi vi phạm cụ thể như sau:"
          - list [ref=f34e932]:
            - listitem [ref=f34e933]:
              - paragraph [ref=f34e934]: "Trường hợp Đối Tác TTLK lên bài trễ so với thời gian quy định (dù có thông báo hoặc không thông báo trước cho Shopee) và Đối Tác TTLK đã hỗ trợ lên bài theo thời gian mới đã cam kết với và được chấp thuận bởi Shopee: Vi phạm lần đầu tiên thì Shopee sẽ có hình thức cảnh cáo thông qua email đối với Đối Tác TTLK vi phạm."
            - listitem [ref=f34e935]:
              - paragraph [ref=f34e936]: "Trường hợp Đối Tác TTLK lên bài trễ so với thời gian quy định (dù có thông báo hoặc không thông báo trước cho Shopee) và Đối Tác TTLK đã hỗ trợ lên bài theo thời gian mới đã cam kết với và được chấp thuận bởi Shopee: Vi phạm từ lần thứ hai (02) trở lên thì Shopee có quyền ngay lập tức chấm dứt hợp tác với Đối Tác TTLK liên quan đến việc thực hiện Chương Trình Shopee KOL Booking (PPP) mà không cần thông báo trước. Đồng thời, Shopee được toàn quyền quyết định trong việc không hợp tác với Đối Tác TTLK trong tất cả các chương trình khác của Shopee."
            - listitem [ref=f34e937]:
              - paragraph [ref=f34e938]: "Trường hợp Đối Tác TTLK đã nhận sản phẩm do Shopee hoặc đối tác của Shopee gửi nhưng không lên bài theo đúng quy định và phạm vi công việc đã cam kết, và không có bất kỳ phản hồi nào về thời gian lên bài mới: Nếu đây là vi phạm ngay từ lần đầu tiên thì Shopee áp dụng tương tự các chế tài quy định tại Điểm (ii) này. Trong trường hợp này, Đối Tác TTLK có nghĩa vụ hoàn trả lại đúng và đủ số lượng sản phẩm đã nhận trước đó từ Shopee hoặc đối tác của Shopee hoặc hoàn trả đúng số tiền tương đương với giá trị sản phẩm đã nhận được để thực hiện phạm vi công việc đã cam kết trong vòng ba (03) ngày kể từ ngày Shopee gửi yêu cầu hoàn trả. Nếu Đối Tác TTLK không thực hiện nghĩa vụ hoàn trả này trong thời hạn yêu cầu, Shopee có toàn quyến quyết định tạm khóa Tài Khoản TTLK của Đối Tác TTLK cho đến khi Đối Tác TTLK hoàn tất việc hoàn trả sản phẩm hoặc số tiền tương đương với giá trị sản phẩm."
          - paragraph [ref=f34e939]:
            - text: Trường hợp Đối Tác TTLK không tuân thủ các quy định về hoàn trả sản phẩm quảng cáo nêu tại Điều Khoản và Điều Kiện này, Shopee có quyền chấm dứt hợp tác với Đối Tác TTLK và/hoặc tiến hành các biện pháp xử lý vi phạm đối với Đối Tác TTLK. Quy định về xử lý vi phạm hoàn trả sản phẩm quảng cáo được nêu
            - link "TẠI ĐÂY" [ref=f34e940] [cursor=pointer]:
              - /url: https://drive.google.com/file/d/1TSocGXla6saIZFqg4Od3KAl06WUfOgXh/view?previousPage=other%20articles
            - text: .
          - generic [ref=f34e941]:
            - heading "ĐIỀU 2. CHƯƠNG TRÌNH QUẢNG CÁO CÙNG KOL (PPP)" [level=2] [ref=f34e942]
            - list [ref=f34e943]:
              - listitem [ref=f34e944]:
                - heading "Đối Tượng Áp Dụng" [level=3] [ref=f34e945]
            - paragraph [ref=f34e946]: Chương Trình Quảng Cáo Cùng KOL (PPP) là chương trình chỉ áp dụng cho Đối Tác TTLK đăng ký tham gia Chương Trình TTLK theo loại hình KOL Affiliate / KOC Affiliate theo quy định tại Mục II – Điều 1; KOL Doanh Nghiệp theo quy định tại Mục II – Điều 2; và MCN theo quy định tại Mục II – Điều 3.
            - list [ref=f34e947]:
              - listitem [ref=f34e948]:
                - heading "Cách Thức Tham Gia Chương Trình Quảng Cáo Cùng KOL (PPP)" [level=3] [ref=f34e949]
            - heading "Đối Tác TTLK chỉ có thể tham gia dựa trên quyết định của Shopee. Shopee bảo lưu quyền lựa chọn Đối Tác TTLK tham gia và tạm đình chỉ hoặc chấm dứt việc tham gia Chương Trình Quảng Cáo Cùng KOL (PPP)." [level=3] [ref=f34e950]
            - list [ref=f34e951]:
              - listitem [ref=f34e952]:
                - heading "Phạm Vi Công Việc" [level=3] [ref=f34e953]
            - list [ref=f34e954]:
              - listitem [ref=f34e955]:
                - paragraph [ref=f34e956]: Người Bán tham gia vào Chương Trình Quảng Cáo Cùng KOL (PPP) có thể bắt đầu cuộc nói chuyện trên Hệ Thống Shopee với Đối Tác TTLK tiềm năng và thống nhất về các hoạt động theo Chương Trình Quảng Cáo Cùng KOL (PPP) sẽ được cung cấp, phí áp dụng cho mỗi bài đăng trên Mạng Xã Hội và/hoặc Phương Tiện TTLK do Đối Tác TTLK thực hiện (“Phí Cố Định”) và ngày đăng bài có liên quan dự kiến. Người Bán Tham Gia sẽ phải ghi nhận các nội dung liên quan đến các hoạt động theo Chương Trình Quảng Cáo Cùng KOL (PPP) trên Sàn TMĐT một cách hợp lý, bao gồm hoa hồng áp dụng cho các Đối Tác TTLK cho mỗi Đơn Hàng Thành Công (hay còn gọi là Phí Hoa Hồng Xtra).
              - listitem [ref=f34e957]:
                - paragraph [ref=f34e958]: "Dựa trên các thỏa thuận giữa Người Bán Tham Gia và Đối Tác TTLK, một giao dịch có tính ràng buộc sẽ được hình thành (“Giao Dịch Quảng Cáo Cùng KOL (PPP)”). Liên quan đến mỗi Giao Dịch Quảng Cáo Cùng KOL PPP, Người Bán Tham Gia sẽ cung cấp Sản Phẩm Trên Sàn TMĐT (“Sản Phẩm Mẫu”) không thu phí cho Đối Tác TTLK trong thời hạn theo thỏa thuận giữa hai bên. Người Bán Tham Gia và Đối Tác TTLK xác nhận và đồng ý rằng:"
            - list [ref=f34e959]:
              - listitem [ref=f34e960]:
                - paragraph [ref=f34e961]: Người Bán Tham Gia sẽ chịu phí vận chuyển và những phí khác, và sẽ bảo đảm rằng Sản Phẩm Mẫu giống như sản phẩm thật (bao gồm nhưng không giới hạn chất lượng và hình dáng). Shopee sẽ không chịu trách nhiệm đối với bất kỳ vấn đề nào phát sinh từ Sản Phẩm Mẫu, bap gồm nhưng không giới hạn ở các tranh chấp, khiếu nại, khiếu kiện liên quan đến Sản Phẩm Mẫu và sản phẩm trên thực tế
              - listitem [ref=f34e962]:
                - paragraph [ref=f34e963]: Đối Tác TTLK sẽ chịu trách nhiệm lưu giữ và bảo quản Sản Phẩm Mẫu, thậm chí trong trường hợp Giao Dịch Quảng Cáo Cùng KOL (PPP) có liên quan bị hủy bỏ hoặc bị chấm dứt trước khi Bên Đối Tác TTLK hoàn tất Giao Dịch Quảng Cáo Cùng KOL (PPP) tương ứng; và
              - listitem [ref=f34e964]:
                - paragraph [ref=f34e965]: Việc không thực hiện đầy đủ các bước nêu trên có thể dẫn đến Dịch Vụ Quảng Cáo Cùng KOL (PPP) bị tự động hủy bỏ.
            - list [ref=f34e966]:
              - listitem [ref=f34e967]:
                - paragraph [ref=f34e968]: Đối Tác TTLK xác nhận đồng ý tuân thủ thời hạn áp dụng việc chấp nhận và xác nhận việc nhận Sản Phẩm Mẫu, và tiến hành đăng bài quảng cáo và hoàn tất Giao Dịch Quảng Cáo Cùng KOL (PPP). Việc vi phạm nghĩa vụ này sẽ dẫn đến việc Giao Dịch Quảng Cáo Cùng KOL (PPP) bị hủy bỏ và Đối Tác TTLK sẽ không nhận được các khoản thanh toán.
            - list [ref=f34e969]:
              - listitem [ref=f34e970]:
                - heading "Nghĩa Vụ Và Cam Kết Của Các Bên Liên Quan" [level=3] [ref=f34e971]
            - list [ref=f34e972]:
              - listitem [ref=f34e973]:
                - paragraph [ref=f34e974]: Người Bán Tham Gia sẽ phải thanh toán Phí Cố Định cho Shopee bằng phương thức thanh toán mà Shopee đề nghị trong thời hạn được nêu trên Hệ Thống Shopee.
              - listitem [ref=f34e975]:
                - paragraph [ref=f34e976]: Việc Đối Tác TTLK bắt đầu thực hiện dịch vụ Chương Trình Quảng Cáo Cùng KOL (PPP) phụ thuộc vào điều kiện Shopee phải nhận được Phí Cố Định.
              - listitem [ref=f34e977]:
                - paragraph [ref=f34e978]: "Đối Tác TTLK sẽ:"
            - list [ref=f34e979]:
              - listitem [ref=f34e980]:
                - paragraph [ref=f34e981]: chịu trách nhiệm chuẩn bị và gửi nội dung để thực hiện Chương Trình Quảng Cáo Cùng KOL (PPP);
              - listitem [ref=f34e982]:
                - paragraph [ref=f34e983]: lấy xác nhận từ Người Bán Tham Gia trước khi đăng tải nội dung thực hiện Chương Trình Quảng Cáo Cùng KOL (PPP) trong khoảng thời gian Người Bán Tham Gia đồng ý. Việc không tuân thủ nghĩa vụ này, Giao Dịch Quảng Cáo Cùng KOL (PPP) sẽ bị hủy bỏ và Đối Tác TTLK sẽ không nhận được bất kỳ khoản thanh toán nào có liên quan. Dựa trên việc Người Bán Tham Gia xác nhận Chương Trình Quảng Cáo Cùng KOL (PPP) đã được hoàn thành bởi Đối Tác TTLK đối với các Giao Dịch Quảng Cáo Cùng KOL (PPP) một cách tương ứng, Shopee sẽ tiến hành giải ngân Phí Cố Định cho Đối Tác TTLK.
            - list [ref=f34e984]:
              - listitem [ref=f34e985]:
                - paragraph [ref=f34e986]: "Đối Tác TTLK xác nhận và đồng ý rằng:"
            - list [ref=f34e987]:
              - listitem [ref=f34e988]:
                - paragraph [ref=f34e989]: Việc hủy Giao Dịch Quảng Cáo Cùng KOL (PPP) (mà không phải là trường hợp hệ thống hủy tự động) phải có sự đồng thuận giữa Người Bán Tham Gia và Đối Tác TTLK có liên quan;
              - listitem [ref=f34e990]:
                - paragraph [ref=f34e991]: Việc Đối Tác TTLK không tuân thủ thời gian áp dụng được quy định trên Hệ Thống Shopee có thể dẫn đến việc tự động chấm dứt Giao Dịch Quảng Cáo Cùng KOL (PPP); và
              - listitem [ref=f34e992]:
                - paragraph [ref=f34e993]: Bất kỳ tranh chấp nào liên quan đến Giao Dịch Quảng Cáo Cùng KOL (PPP) (bao gồm nhưng không giới hạn việc thanh toán Phí Cố Định và việc cung cấp các dịch vụ theo Chương Trình Quảng Cáo Cùng KOL (PPP)) sẽ được xem xét và giải quyết bởi Shopee, và Shopee có quyền quyết định cuối cùng đối với kết quả giải quyết tranh chấp (bao gồm nhưng không giới hạn việc thanh toán hoặc hoàn trả một phần Phí Cố Định). Đối Tác TTLK sẽ cung cấp tất cả những thông tin và tài liệu cùng sự hỗ trợ cần thiết theo yêu cầu của Shopee liên quan đến tranh chấp này.
            - list [ref=f34e994]:
              - listitem [ref=f34e995]:
                - paragraph [ref=f34e996]: Mỗi bên liên quan đến Chương Trình Quảng Cáo Cùng KOL (PPP) cũng như Giao Dịch Quảng Cáo Cùng KOL (PPP) tương ứng sẽ chịu các nghĩa vụ thuế phát sinh cho bên đó theo Điều Khoản và Điều Kiện này.
              - listitem [ref=f34e997]:
                - paragraph [ref=f34e998]: Phí Cố Định do Shopee xác định sẽ có giá trị cuối cùng và ràng buộc Đối Tác TTLK. Sau khi công việc theo Chương Trình Quảng Cáo Cùng KOL (PPP) được xác nhận hoàn tất, tổng tiền có thể nhận được cho từng công việc tương ứng sẽ được cập nhật vào kỳ đối soát gần nhất sau đó theo quy trình đối soát và thanh toán tương ứng với quy định cho từng loại hình mà Đối Tác TTLK đăng ký theo Điều Khoản và Điều Kiện này.
            - strong:
              - strong
            - heading "ĐIỀU 3. CHƯƠNG TRÌNH SHOPEE KOL LIVESTREAM (PPLS)" [level=2] [ref=f34e999]
            - list [ref=f34e1000]:
              - listitem [ref=f34e1001]:
                - heading "Đối Tượng Áp Dụng" [level=3] [ref=f34e1002]
            - heading "Chương Trình Shopee KOL Livestream (PPLS) là chương trình chỉ áp dụng cho Đối Tác TTLK đăng ký tham gia Chương Trình TTLK theo loại hình KOL Affiliate / KOC Affiliate theo quy định tại Mục II – Điều 1; KOL Doanh Nghiệp theo quy định tại Mục II – Điều 2; và MCN theo quy định tại Mục II – Điều 3." [level=3] [ref=f34e1003]
            - list [ref=f34e1004]:
              - listitem [ref=f34e1005]:
                - heading "Cách Thức Tham Gia Chương Trình Shopee KOL Livestream (PPLS)" [level=3] [ref=f34e1006]
            - paragraph [ref=f34e1007]: "Shopee sẽ gửi email thông báo hợp tác cho Đối Tác TTLK với tiêu đề: “[Shopee KOL Booking Livestream] – Tên KOL – Xác nhận hợp tác dự án [Tên Dự Án]” (“Email Hợp Tác”) để ghi nhận chi tiết yêu cầu về nội dung công việc, thời gian diễn ra dự án, thời hạn phản hồi về việc chấp nhận hợp tác của Đối Tác TTLK, chi tiết các chi phí chi trả (“Chi Phí Hợp Tác Livestream”) ."
            - paragraph [ref=f34e1008]: Đối Tác TTLK sẽ xem xét, và xác nhận tham gia dự án bằng cách phản hồi bằng email đối với Email Hợp Tác mà Shopee đã gửi (“Email Xác Nhận Hợp Tác”). Email Xác Nhận Hợp Tác này sẽ là một phần không tách rời Điều Khoản và Điều Kiện này.
            - paragraph [ref=f34e1009]: Đối Tác TTLK đồng ý một cách rõ ràng rằng nếu Shopee không nhận được bất kỳ phản hồi và/hoặc xác nhận nào bằng email từ Đối Tác TTLK trong vòng 3 (ba) ngày kể từ ngày gửi Email Hợp Tác, thì Đối Tác TTLK được xem là đồng ý và chịu sự ràng buộc với toàn bộ những nội dung trong Email Hợp Tác như thể Đối Tác TTLK đã gửi Email Xác Nhận Hợp Tác đến cho Shopee như quy định tại đoạn liền kề nêu trên. Để làm rõ, trong khuôn khổ chi phí thỏa thuận tại Email Xác Nhận Hợp Tác, Chi Phí Hợp Tác Livestream sẽ được xác định cụ thể dựa theo kết quả nghiệm thu thực tế của từng công việc cụ thể cho Chương Trình Shopee KOL Livestream (PPLS), và Chi Phí Hợp Tác Livestream thanh toán cuối cùng sẽ được thông báo đến Đối Tác TTLK thông qua Email Hợp Tác nêu tại điều này.
            - list [ref=f34e1010]:
              - listitem [ref=f34e1011]:
                - heading "Nghĩa Vụ Và Cam Kết Của Đối Tác TTLK" [level=3] [ref=f34e1012]
            - list [ref=f34e1013]:
              - listitem [ref=f34e1014]:
                - paragraph [ref=f34e1015]:
                  - text: Đối Tác TTLK tuân thủ các các quy định về Livestream của Shopee vào từng thời điểm, bao gồm nhưng không giới hạn ở các quy định
                  - link "TẠI ĐÂY" [ref=f34e1016] [cursor=pointer]:
                    - /url: https://help.shopee.vn/portal/10/article/204724?previousPage=other%20articles
                  - text: .
              - listitem [ref=f34e1017]:
                - paragraph [ref=f34e1018]: Đối Tác TTLK không được sử dụng và/hoặc sửa đổi các Tài Liệu Livestream, cũng như các yêu cầu và thông tin, nội dung quảng cáo được cung cấp từ Shopee mà không có sự đồng ý trước bằng văn bản của Shopee, trừ khi việc cho phép được quy định cụ thể theo các điều khoản của Điều Khoản và Điều Kiện này. Nhằm mục đích của Điều Khoản và Điều Kiện này, Tài Liệu Livestream nghĩa là các thông tin, tư liệu, mã khuyến mãi phục vụ cho từng chiến dịch của các đối tác của Shopee có liên quan đến Chương Trình Shopee KOL Livestream (PPLS) này.
              - listitem [ref=f34e1019]:
                - paragraph [ref=f34e1020]: Đối Tác TTLK không được phép thay đổi thông tin đăng nhập Tài Khoản TTLK trong thời gian diễn ra livestream (bao gồm 7 (bảy) ngày trước và trong ngày diễn ra livestream). Nếu Đối Tác TTLK tự ý thay đổi thông tin đăng nhập, Shopee sẽ không cam đoan, bảo đảm, cam kết hay chịu trách nhiệm cho bất kỳ khoản Phí Hoa Hồng Xtra nào từ Người Bán mà Đối Tác TTLK có thể nhận được trong buổi livestream. Đồng thời, Đối Tác TTLK sẽ phải tự chịu trách nhiệm và chi phí cho các quyền lợi hợp lệ theo đúng quy định của Shopee cho các quyền lợi và ưu đãi được trao cho người dùng khi tương tác hoặc tham gia vào buổi livestream của mình.
              - listitem [ref=f34e1021]:
                - paragraph [ref=f34e1022]: Đối Tác TTLK đảm bảo tuân thủ thực hiện và tham dự đúng theo kế hoạch đã cam kết tại thông báo bằng văn bản của Shopee (bao gồm nhưng không giới hạn ở việc tuân thủ thực hiện đầy đủ số giờ livestream, thời gian bắt đầu và kết thúc việc livestream, các thời gian và yêu cầu khác từ Shopee vào từng thời điểm như đã thông báo trước cho Đối Tác TTLK).
              - listitem [ref=f34e1023]:
                - paragraph [ref=f34e1024]: Đối Tác TTLK chỉ được dùng các Tài Liệu Livestream, thông tin và nội dung tiếp thị được cung cấp hoặc định hướng bởi Shopee cho mục đích duy nhất là để thực hiện các hoạt động hợp tác theo Chương Trình Shopee KOL Livestream (PPLS) giữa Đối Tác TTLK và Shopee, và không được đề cập đến bất cứ hoạt động kinh doanh nào khác của Đối Tác TTLK dù là trực tiếp hoặc gián tiếp. Mọi thông tin và nội dung riêng khác của Đối Tác TTLK có đề cập hoặc có liên quan đến Shopee dù theo bất cứ cách nào nhưng chưa được sự chấp thuận trước bằng văn bản bởi Shopee và không liên quan đến việc thực hiện Chương Trình Shopee KOL Livestream (PPLS) đều bị nghiêm cấm. Nếu Đối Tác TTLK sử dụng các thông tin, nội dung quảng cáo riêng có đề cập hoặc có liên quan đến Shopee mà chưa nhận được sự đồng ý từ Shopee theo bất cứ cách nào đều bị coi là hành vi vi phạm nghiêm trọng Điều Khoản và Điều Kiện này của Đối Tác TTLK.
              - listitem [ref=f34e1025]:
                - paragraph [ref=f34e1026]: Đối Tác TTLK không được lồng ghép các nội dung vi phạm pháp luật, đạo đức công cộng, hoặc xâm phạm quyền của bên thứ ba trong quá trình thực hiện các dự án cụ thể cho Chương Trình Shopee KOL Livestream (PPLS) (“Nội Dung Cấm Livestream”). Nhằm mục đích của Điều này, Nội Dung Cấm Livestream này bao gồm, nhưng không giới hạn, các chương trình kích động bạo lực, nội dung và ảnh minh họa gợi dục và khiêu dâm, tuyên bố gây nhầm lẫn hoặc nội dung mang tính phân biệt đối xử (ví dụ về giới tính, chủng tộc, chính trị, tôn giáo, quốc tịch hoặc tàn tật). Nội Dung Cấm Livestream này không được đề cập trong quá trình thực hiện các Chiến Dịch cụ thể cho Chương Trình Shopee KOL Livestream (PPLS) dưới bất kỳ hình thức nào (dù là trực tiếp, gián tiếp, hay ngụ ý trên các Kênh Truyền Thông của KOL), và cũng không được tạo đường dẫn liên kết trong quá trình livestream hoặc từ những trang Mạng Xã Hội và/hoặc Kênh Truyền Thông của Đối Tác TTLK đến nội dung tương ứng trên các trang mạng điện tử khác mà theo Shopee có thể bị xếp vào nhóm Nội Dung Cấm Livestream.
              - listitem [ref=f34e1027]:
                - paragraph [ref=f34e1028]: Đối Tác TTLK đồng ý và cho phép không hủy ngang việc Shopee sử dụng hình ảnh của chính Đối Tác TTLK quảng bá cho livestream (bao gồm nhưng không giới hạn ở hình ảnh cá nhân của Đối Tác TTLK và nội dung của việc livestream thực hiện bởi Đối Tác TTLK theo yêu cầu của Shopee) và thời gian đăng tải các nội dung đó một cách tương ứng. Đối Tác TTLK không được quyền gỡ bỏ các Tài Liệu Livestream cho các chiến dịch tương ứng của Người Bán bất cứ lúc nào kể cả khi đã hoàn tất công việc nêu tại Điều Khoản và Điều Kiện này, hoặc hoàn tất từng chiến dịch cụ thể, hoặc chấm dứt việc tham gia Chương trình nói chung cũng như Chương Trình Shopee KOL Livestream (PPLS) nói riêng theo Điều Khoản và Điều Kiện này, trừ khi Shopee đồng ý một cách rõ ràng bằng văn bản.
              - listitem [ref=f34e1029]:
                - paragraph [ref=f34e1030]: Trong trường hợp Đối Tác TTLK vi phạm Điều Khoản và Điều Kiện này, Shopee có toàn quyền quyết định việc không thanh toán cho Đối Tác TTLK bất kỳ khoản thanh toán nào Đối Tác TTLK được hưởng.
            - list [ref=f34e1031]:
              - listitem [ref=f34e1032]:
                - heading "Điều Khoản Phạt" [level=3] [ref=f34e1033]
            - list [ref=f34e1034]:
              - listitem [ref=f34e1035]:
                - paragraph [ref=f34e1036]: "Trường hợp Đối Tác TTLK không tuân thủ nghiêm ngặt các quy định về thời gian, sản phẩm, hướng dẫn nội dung và hình ảnh về livestream của các nhãn hàng; cũng như vi phạm các điều khoản về nghĩa vụ của Đối Tác TTLK đã được quy định tại Điều Khoản và Điều Kiện này, Shopee có quyền áp dụng các chế tài được quy định tại Điều Khoản và Điều Kiện này (bao gồm nhưng không giới hạn ở việc phạt và/hoặc chấm dứt hợp tác với Đối Tác TTLK vi phạm cụ thể như sau:"
            - paragraph [ref=f34e1037]: "Đối với Đối Tác TTLK tham gia tất cả các Chương Trình “Shopee KOL Livestream”:"
            - list [ref=f34e1038]:
              - listitem [ref=f34e1039]:
                - paragraph [ref=f34e1040]: "Trường hợp Đối Tác TTLK tham gia buổi livestream trễ với thời gian quy định (dù có thông báo hoặc không thông báo trước cho Shopee) và Đối Tác TTLK đã hỗ trợ livestream theo thời gian mới đã cam kết với và được chấp thuận bởi Shopee: Vi phạm lần đầu tiên thì Shopee sẽ có hình thức cảnh cáo thông qua email đối với Đối Tác TTLK vi phạm."
              - listitem [ref=f34e1041]:
                - paragraph [ref=f34e1042]: "Trường hợp Bên Tham Gia buổi livestream trễ với thời gian quy định (dù có thông báo hoặc không thông báo trước cho Shopee) và Đối Tác TTLK đã hỗ trợ livestream theo thời gian mới đã cam kết với và được chấp thuận bởi Shopee: Vi phạm từ lần thứ hai (02) trở lên thì Shopee có quyền ngay lập tức chấm dứt hợp tác với Đối Tác TTLK liên quan đến việc thực hiện Chương Trình Shopee KOL Livestream (PPLS) mà không cần thông báo trước. Đồng thời, Shopee được toàn quyền quyết định trong việc không hợp tác với Đối Tác TTLK trong tất cả các chiến dịch khác của Shopee."
              - listitem [ref=f34e1043]:
                - paragraph [ref=f34e1044]: "Trường hợp Đối Tác TTLK đã nhận Sản Phẩm Mẫu do Shopee và/hoặc đối tác / nhãn hàng gửi nhưng không livestream theo đúng quy định và phạm vi công việc đã cam kết, không có bất kỳ phản hồi nào về thời gian livestream mới: Vi phạm ngay từ lần đầu tiên thì Shopee áp dụng tương tự các chế tài quy định tại Điều 5.1.a. Trong trường hợp này, Đối Tác TTLK có nghĩa vụ hoàn trả lại đúng và đủ số lượng Sản Phẩm Mẫu hoặc hoàn trả đúng số tiền tương đương với Sản Phẩm Mẫu đã nhận trước đó từ Shopee để thực hiện phạm vi công việc đã cam kết trong vòng ba (03) ngày kể từ ngày Shopee và/hoặc đối tác/nhãn hàng gửi yêu cầu hoàn trả. Nếu Đối Tác TTLK không thực hiện nghĩa vụ hoàn trả này trong thời hạn yêu cầu, Shopee có toàn quyền quyết định tạm khóa Tài Khoản TTLK của Đối Tác TTLK cho đến khi Đối Tác TTLK hoàn tất việc hoàn trả Sản Phẩm Mẫu hoặc số tiền tương đương với giá trị Sản Phẩm Mẫu."
            - paragraph [ref=f34e1045]:
              - text: Trường hợp Đối Tác TTLK không tuân thủ các quy định về hoàn trả Sản Phẩm Mẫu nêu tại Điều Khoản và Điều Kiện này, Shopee có quyền chấm dứt hợp tác với Đối Tác TTLK và/hoặc tiến hành các biện pháp xử lý vi phạm đối với Đối Tác TTLK. Quy định về xử lý vi phạm hoàn trả sản phẩm quảng cáo được nêu
              - link "TẠI ĐÂY" [ref=f34e1046] [cursor=pointer]:
                - /url: https://drive.google.com/file/d/1TSocGXla6saIZFqg4Od3KAl06WUfOgXh/view?previousPage=other%20articles
              - text: .
            - paragraph [ref=f34e1047]: "Đối với các Đối Tác TTLK tham gia Chương Trình Shopee KOL Livestream có nhận chi phí hợp tác cố định được ghi nhận tại Email Xác Nhận Hợp Tác:"
            - list [ref=f34e1048]:
              - listitem [ref=f34e1049]:
                - paragraph [ref=f34e1050]: "Trường hợp Đối Tác TTLK tham gia buổi livestream trễ với thời gian quy định (dù có thông báo hoặc không thông báo trước cho Shopee) và Đối Tác TTLK đã hỗ trợ livestream theo thời gian mới đã cam kết với và được chấp thuận bởi Shopee: Vi phạm lần đầu tiên thì Shopee sẽ có hình thức cảnh cáo thông qua email đối với Đối Tác TTLK vi phạm."
              - listitem [ref=f34e1051]:
                - paragraph [ref=f34e1052]: "Trường hợp Đối Tác TTLK tham gia buổi livestream trễ với thời gian quy định (dù có thông báo hoặc không thông báo trước cho Shopee) và Đối Tác TTLK đã hỗ trợ livestream theo thời gian mới đã cam kết với và được chấp thuận bởi Shopee: Vi phạm từ lần thứ hai (02) trở lên thì Shopee có quyền áp dụng các hình thức phạt như sau:"
            - list [ref=f34e1053]:
              - listitem [ref=f34e1054]:
                - paragraph [ref=f34e1055]: "Đối với Đối Tác TTLK đi trễ từ 1-15 phút (kể từ khi giờ phát trực tiếp bắt đầu): Đối Tác TTLK sẽ bị phạt 20% chi phí hợp tác cố định thuộc Chương Trình Shopee KOL Livestream (PPLS) mà không cần thông báo trước."
              - listitem [ref=f34e1056]:
                - paragraph [ref=f34e1057]: "Đối với Đối Tác TTLK đi trễ từ 15 phút trở lên (kể từ khi giờ phát trực tiếp bắt đầu): Shopee có quyền ngay lập tức chấm dứt hợp tác với Đối Tác TTLK liên quan đến việc thực hiện Chương Trình Shopee KOL Livestream (PPLS) mà không cần thông báo trước, đồng thời Shopee cũng sẽ không thanh toán bất kỳ khoản phí nào cho Đối Tác TTLK."
              - listitem [ref=f34e1058]:
                - paragraph [ref=f34e1059]: "Trường hợp Đối Tác TTLK đã nhận sản phẩm do Shopee và/hoặc đối tác / nhãn hàng gửi nhưng không livestream theo đúng quy định và phạm vi công việc đã cam kết, không có bất kỳ phản hồi nào về thời gian livestream mới: Vi phạm ngay từ lần đầu tiên thì Shopee áp dụng tương tự các chế tài quy định tại Điều 5.1.2.a và vi phạm lần thứ 2 trở đi sẽ áp dụng tương tự các chế tài quy định tại Điều 5.1.2.b. Trong trường hợp này, Đối Tác TTLK có nghĩa vụ hoàn trả lại đúng và đủ số lượng Sản Phẩm Mẫu hoặc hoàn trả đúng số tiền tương đương với Sản Phẩm Mẫu đã nhận trước đó từ Shopee để thực hiện phạm vi công việc đã cam kết trong vòng ba (03) ngày kể từ ngày Shopee và/hoặc đối tác/nhãn hàng gửi yêu cầu hoàn trả. Nếu Đối Tác TTLK không thực hiện nghĩa vụ hoàn trả này trong thời hạn yêu cầu, Shopee có toàn quyền quyết định tạm khóa Tài Khoản TTLK của Đối Tác TTLK cho đến khi Đối Tác TTLK hoàn tất việc hoàn trả Sản Phẩm Mẫu hoặc số tiền tương đương với giá trị Sản Phẩm Mẫu."
            - paragraph [ref=f34e1060]:
              - text: Trường hợp Đối Tác TTLK không tuân thủ các quy định về hoàn trả Sản Phẩm Mẫu nêu tại Điều Khoản và Điều Kiện này, Shopee có quyền chấm dứt hợp tác với Đối Tác TTLK và/hoặc tiến hành các biện pháp xử lý vi phạm đối với Đối Tác TTLK. Quy định về xử lý vi phạm hoàn trả sản phẩm quảng cáo được nêu
