          - paragraph [ref=f34e862]: Shopee có toàn quyền quyết định chấp nhận hoặc từ chối việc đăng ký tham gia Chương Trình TTLK của Đối Tác TTLK theo loại hình Short-tail này mà không cần phải đưa ra bất kỳ giải thích hoặc lý do nào.
