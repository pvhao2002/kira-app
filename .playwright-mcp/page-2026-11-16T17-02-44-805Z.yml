            - paragraph [ref=f34e1062]: "[1] Quảng Cáo Tự Động Chuyển Hướng tức là tự động chuyển hướng người dùng đến các trang mạng của Nhà quảng cáo mà không có sự kích hoạt hoặc hành động nào của người dùng (như nhấp chuột, chạm vào)."
            - paragraph
            - heading "ĐIỀU 4. CHƯƠNG TRÌNH SHOPEE KOL VIDEO (PPV)" [level=2] [ref=f34e1063]
            - list [ref=f34e1064]:
              - listitem [ref=f34e1065]:
                - heading "Đối Tượng Áp Dụng" [level=3] [ref=f34e1066]
            - heading "Chương Trình Shopee KOL Video (PPV) là chương trình chỉ áp dụng cho Đối Tác TTLK đăng ký tham gia Chương Trình TTLK theo loại hình KOL Affiliate / KOC Affiliate theo quy định tại Chương II – Điều 1; KOL Doanh Nghiệp theo quy định tại Chương II – Điều 2; và MCN theo quy định tại Chương II – Điều 3." [level=3] [ref=f34e1067]
            - list [ref=f34e1068]:
              - listitem [ref=f34e1069]:
                - heading "Cách Thức Tham Gia Chương Trình Shopee KOL Video (PPV)" [level=3] [ref=f34e1070]
            - paragraph [ref=f34e1071]: "Shopee sẽ gửi email thông báo hợp tác cho Đối Tác TTLK với tiêu đề: “[Shopee KOL Booking Video] – Tên KOL – Xác nhận hợp tác dự án [Tên Dự Án]” (“Email Hợp Tác”) để ghi nhận chi tiết yêu cầu về nội dung công việc, thời gian diễn ra dự án, thời hạn phản hồi về việc chấp nhận hợp tác của Đối Tác TTLK, chi tiết các chi phí chi trả (“Chi Phí Hợp Tác Video”) ."
            - paragraph [ref=f34e1072]: Đối Tác TTLK sẽ xem xét, và xác nhận tham gia Chiến Dịch bằng cách phản hồi bằng email đối với Email Hợp Tác mà Shopee đã gửi (“Email Xác Nhận Hợp Tác”). Email Xác Nhận Hợp Tác này sẽ là một phần không tách rời Điều Khoản và Điều Kiện này.
            - paragraph [ref=f34e1073]: Nếu Shopee không nhận được bất kỳ phản hồi và/hoặc xác nhận nào bằng email từ Đối Tác TTLK trong vòng 3 ngày kể từ ngày gửi Email Hợp Tác, thì Đối Tác TTLK được xem là đồng ý và chịu sự ràng buộc với toàn bộ những nội dung trong Email Hợp Tác như thể Đối Tác TTLK đã gửi Email Xác Nhận Hợp Tác đến cho Shopee như quy định tại đoạn liền kề nêu trên. Để làm rõ, trong khuôn khổ chi phí thỏa thuận tại Email Xác Nhận Hợp Tác, Chi Phí Hợp Tác Video sẽ được xác định cụ thể dựa theo kết quả nghiệm thu thực tế của từng Chiến Dịch cụ thể cho Chương Trình Shopee KOL Video, và Chi Phí Hợp Tác Video thanh toán cuối cùng sẽ được thông báo đến Bên KOL thông qua Email Hợp Tác nêu tại điều này.
            - list [ref=f34e1074]:
              - listitem [ref=f34e1075]:
                - heading "Nghĩa Vụ Và Cam Kết Của Đối Tác TTLK" [level=3] [ref=f34e1076]
            - list [ref=f34e1077]:
              - listitem [ref=f34e1078]:
                - paragraph [ref=f34e1079]: Đối Tác TTLK không được sử dụng và/hoặc sửa đổi các Tài Liệu Video, cũng như các yêu cầu và thông tin, nội dung quảng cáo được cung cấp từ Shopee mà không có sự đồng ý trước bằng văn bản của Shopee, trừ khi việc cho phép được quy định cụ thể theo các điều khoản của Điều Khoản và Điều Kiện này. Nhằm mục đích của Điều Khoản và Điều Kiện này, Tài Liệu Video nghĩa là các thông tin, tư liệu, mã khuyến mãi phục vụ cho từng chiến dịch của các đối tác của Shopee có liên quan đến Chương Trình Shopee KOL Video (PPV) này.
              - listitem [ref=f34e1080]:
                - paragraph [ref=f34e1081]: Đối Tác TTLK không được phép thay đổi thông tin đăng nhập Tài Khoản TTLK trong thời gian tham gia thực hiện bất kỳ hoạt động này theo Chương Trình Shopee KOL Video (PPV) này. Nếu Đối Tác TTLK tự ý thay đổi thông tin đăng nhập của Tài Khoản TTLK, Shopee sẽ không cam đoan, bảo đảm, cam kết hay chịu trách nhiệm cho bất kỳ khoản Phí Hoa Hồng nào từ người bán mà Đối Tác TTLK có thể nhận được khi tham Chương Trình Shopee KOL Video (PPV) một cách tương ứng.
              - listitem [ref=f34e1082]:
                - paragraph [ref=f34e1083]: Đối Tác TTLK đảm bảo tuân thủ thực hiện và tham dự đúng theo kế hoạch đã cam kết tại thông báo bằng văn bản của Shopee (bao gồm nhưng không giới hạn ở việc tuân thủ thực hiện đầy đủ số video, thời lượng của 1 video, số sản phẩm tối thiểu trong 1 (một) video và yêu cầu khác từ Shopee vào từng thời điểm như đã thông báo trước cho Đối Tác TTLK).
              - listitem [ref=f34e1084]:
                - paragraph [ref=f34e1085]: Đối Tác TTLK chỉ được dùng các Tài Liệu Video, thông tin và nội dung quảng cáo được cung cấp hoặc định hướng bởi Shopee cho mục đích duy nhất là để thực hiện các hoạt động hợp tác theo Chương Trình Shopee KOL Video (PPV) giữa Đối Tác TTLK và Shopee, và không được đề cập đến bất cứ hoạt động kinh doanh nào khác của Đối Tác TTLK dù là trực tiếp hoặc gián tiếp. Mọi thông tin và nội dung riêng khác của Đối Tác TTLK có đề cập hoặc có liên quan đến Shopee dù theo bất cứ cách nào nhưng chưa được sự chấp thuận trước bằng văn bản bởi Shopee và không liên quan đến việc thực hiện Chương Trình Shopee KOL Video (PPV) đều bị nghiêm cấm. Nếu Đối Tác TTLK sử dụng các thông tin, nội dung quảng cáo riêng có đề cập hoặc có liên quan đến Shopee mà chưa nhận được sự đồng ý từ Shopee theo bất cứ cách nào đều bị coi là hành vi vi phạm nghiêm trọng Điều Khoản và Điều Kiện này của Đối Tác TTLK.
              - listitem [ref=f34e1086]:
                - paragraph [ref=f34e1087]: Trong trường hợp Đối Tác TTLK vi phạm Điều Khoản và Điều Kiện này, Shopee có toàn quyền quyết định việc không thanh toán cho Đối Tác TTLK bất kỳ khoản thanh toán nào Đối Tác TTLK được hưởng.
            - list [ref=f34e1088]:
              - listitem [ref=f34e1089]:
                - heading "Điều Khoản Phạt" [level=3] [ref=f34e1090]
            - paragraph [ref=f34e1091]: "Trường hợp Đối Tác TTLK không tuân thủ nghiêm ngặt các quy định về thời gian, sản phẩm, hướng dẫn nội dung và hình ảnh về video của các nhãn hàng; cũng như vi phạm các điều khoản về nghĩa vụ của Đối Tác TTLK đã được quy định tại Điều Khoản và Điều Kiện này, Shopee có quyền áp dụng các chế tài được quy định tại Điều Khoản và Điều Kiện này (bao gồm nhưng không giới hạn ở việc phạt và/hoặc chấm dứt hợp tác với Đối Tác TTLK vi phạm cụ thể như sau:"
            - list [ref=f34e1092]:
              - listitem [ref=f34e1093]:
                - paragraph [ref=f34e1094]: "Đối với Đối Tác TTLK tham gia tất cả các Chương Trình Shopee KOL Video (PPV):"
            - paragraph [ref=f34e1095]: "(i) Trường hợp Đối Tác TTLK đăng tải video trễ với thời gian quy định (dù có thông báo hoặc không thông báo trước cho Shopee) và Bên KOL đã hỗ trợ đăng video theo thời gian mới đã cam kết với và được chấp thuận bởi Shopee: Vi phạm lần đầu tiên thì Shopee sẽ có hình thức cảnh cáo thông qua email đối với Đối Tác TTLK vi phạm."
            - paragraph [ref=f34e1096]: "(ii) Trường hợp Đối Tác TTLK đăng tải video trễ với thời gian quy định (dù có thông báo hoặc không thông báo trước cho Shopee) và Đối Tác TTLK đã hỗ trợ đăng tải video theo thời gian mới đã cam kết với và được chấp thuận bởi Shopee: Vi phạm từ lần thứ hai (02) trở lên thì Shopee có quyền ngay lập tức chấm dứt hợp tác với Đối Tác TTLK liên quan đến việc thực hiện Chương Trình “Shopee KOL Video (PPV)” mà không cần thông báo trước. Đồng thời, Shopee được toàn quyền quyết định trong việc không hợp tác với Đối Tác TTLK trong tất cả các chiến dịch khác của Shopee."
            - paragraph [ref=f34e1097]: "(iii) Trường hợp Đối Tác TTLK đã nhận sản phẩm do Shopee và/hoặc đối tác / nhãn hàng gửi nhưng không đăng tải video theo đúng quy định và phạm vi công việc đã cam kết, không có bất kỳ phản hồi nào về thời gian đăng tải video mới: Vi phạm ngay từ lần đầu tiên thì Shopee áp dụng tương tự các chế tài quy định tại Điều 4.1.a. Trong trường hợp này, Đối Tác TTLK có nghĩa vụ hoàn trả lại đúng và đủ số lượng sản phẩm hoặc hoàn trả đúng số tiền tương đương với số lượng sản phẩm đã nhận trước đó từ Shopee để thực hiện phạm vi công việc đã cam kết trong vòng ba (03) ngày kể từ ngày Shopee và/hoặc đối tác / nhãn hàng gửi yêu cầu hoàn trả. Nếu Đối Tác TTLK không thực hiện nghĩa vụ hoàn trả này trong thời hạn yêu cầu, có toàn quyền quyết định tạm khóa Tài Khoản TTLK của Đối Tác TTLK cho đến khi Đối Tác TTLK hoàn tất việc hoàn trả Sản Phẩm Mẫu hoặc số tiền tương đương với giá trị Sản Phẩm Mẫu."
