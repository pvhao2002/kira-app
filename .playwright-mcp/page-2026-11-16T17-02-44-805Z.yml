              - paragraph [ref=f34e795]: Dự kiến từ ngày 5 đến ngày 15 của tháng T+1, Đối Tác MCN kiểm tra lịch sử thanh toán trên Hệ Thống Shopee, và tùy theo quyết định của Shope vào từng thời điểm, Shopee sẽ gửi email đối soát thông báo Phí Hoa Hồng Quản Lý MCN được duyệt cho Đối Tác MCN.
            - listitem [ref=f34e796]:
              - paragraph [ref=f34e797]: Dự kiến trong vòng tối thiểu ba mươi (30) Ngày Làm Việc kể từ ngày Shopee nhận đầy đủ chứng từ thanh toán hợp lệ từ đối tác theo quy định tại Chương I - Điều 9, Shopee tiến hành thanh toán Phí Hoa Hồng Quản Lý MCN đối với các Đơn Hàng Thành Công cho Đối Tác MCN theo tỷ lệ hoa hồng thỏa thuận giữa Đối Tác MCN và Đối Tác TTLK trực thuộc Đối Tác MCN.
          - list [ref=f34e798]:
            - listitem [ref=f34e799]:
              - paragraph [ref=f34e800]: "Đối với đơn vị liên kết thứ cấp trực thuộc Đối Tác MCN:"
          - paragraph [ref=f34e801]: Việc đối soát để tính toán Kết Quả TTLK và thanh toán giá trị mỗi tháng mà đơn vị liên kết thứ cấp trực thuộc Đối Tác TTLK có thể thụ hưởng sẽ tương ứng với từng loại hình tham gia Chương Trình TTLK của các đơn vị liên kết thứ cấp này một cách tương ứng.
          - paragraph [ref=f34e802]: "Lưu ý:"
          - list [ref=f34e803]:
            - listitem [ref=f34e804]:
              - paragraph [ref=f34e805]: Nếu ngày gửi đối soát hoặc ngày thanh toán Phí Hoa Hồng theo kế hoạch nêu trên trùng vào cuối tuần (thứ Bảy, Chủ Nhật) hoặc dịp Lễ/ Tết theo quy định của pháp luật, Shopee sẽ thực hiện những công việc này vào Ngày Làm Việc tiếp theo.
            - listitem [ref=f34e806]:
              - paragraph [ref=f34e807]: Để đảm bảo Đối Tác TTLK có thể nhận được Phí Hoa Hồng hàng tháng đầy đủ và nhanh chóng, Đối Tác TTLK vui lòng kiểm tra thông tin tài khoản thanh toán hoa hồng đã cập nhật trên trang Affiliate Website (https://affiliate.shopee.vn/). Trường hợp Đối Tác TTLK cập nhật hoặc cung cấp thông tin thanh toán không chính xác hoặc không đầy đủ dẫn đến việc chậm trễ hoặc trì hoãn thanh toán bất kỳ khoản khoản giá trị nào mà Đối Tác TTLK được thụ hưởng từ Shopee, thì Shopee sẽ không bị xem là vi phạm Điều Khoản và Điều Kiện này. Đối Tác TTLK phải hoàn toàn chịu trách nhiệm (bao gồm nhưng không giới hạn ở các khoản bồi thường, giải quyết khiếu nại từ bên thứ ba, nếu có) liên quan đến các thông tin thanh toán của Đối Tác TTLK.
            - listitem [ref=f34e808]:
              - paragraph [ref=f34e809]: Ngoài Phí Hoa Hồng Quản Lý MCN và Phí Dịch Vụ Chiến Dịch, MCN có thể được nhận thêm Phí Hoa Hồng bao gồm nhưng không giới hạn các khoản phí hoa hồng thưởng được tính trên hiệu suất hoặc các phí booking khác... đã và sẽ được quy định trong Điều Khoản và Điều Kiện này, nội dung chi tiết về phí hoa hồng thưởng này có thể được thống nhất và đối soát giữa Shopee và MCN thông qua email.
