application:
  datasource:
    ex:
      jdbc-url: "jdbc:mysql://${DB_EX_HOST:localhost}:${DB_EX_PORT:3306}/${DB_EX_NAME:kira}?useUnicode=true&createDatabaseIfNotExist=true"
      username: "${DB_EX_USERNAME:root}"
      password: "${DB_EX_PASSWORD:1234}"
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 100
    primary:
      jdbc-url: "jdbc:mysql://${DB_PRIMARY_HOST:localhost}:${DB_PRIMARY_PORT:3310}/${DB_PRIMARY_NAME:kira}?useUnicode=true&createDatabaseIfNotExist=true"
      username: "${DB_PRIMARY_USERNAME:kira_user}"
      password: "${DB_PRIMARY_PASSWORD:kira_password}"
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 5
    replica:
      jdbc-url: "jdbc:mysql://${DB_REPLICA_HOST:localhost}:${DB_REPLICA_PORT:3311}/${DB_REPLICA_NAME:kira}?useUnicode=true"
      username: "${DB_REPLICA_USERNAME:kira_user}"
      password: "${DB_REPLICA_PASSWORD:kira_password}"
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 5
kira:
  crawl-schedule:
    enabled: ${KIRA_CRAWL_SCHEDULE_ENABLED:true}

spring:
  application:
    name: kira-service
  profiles:
    active: composite
  output:
    ansi:
      enabled: NEVER
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  task:
    scheduling:
      pool:
        size: 12
    execution:
      pool:
        core-size: 12
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/}
    connection-timeout: 60000         # timeout 60s khi tạo connection
    requested-heartbeat: 30           # giữ heartbeat để phát hiện connection chết
    cache:
      channel:
        size: 50                      # cho phép cache 50 channel (hữu ích khi publish nhiều message cùng lúc)
      connection:
        mode: CHANNEL                 # 1 TCP connection, nhiều channel để publish song song
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: false
server:
  port: 2308
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 512

logging:
  level:
    root: info
  file:
    # Gộp vào folder chung để Promtail đọc (chạy từ IntelliJ). Có thể set LOG_DIR tuyệt đối.
    name: ${LOG_DIR:./logs}/kira-service.log
jwt:
  secret: "${JWT_SECRET:f15745bb2fd9b06cce06c1d99bc32908667944325a65373598496e9a45eb367dcbe5fa255cd25a143f9393999e6e2f08ef69fd3ff2b145da7149bbbaacd762e3}"
  expiration: "${JWT_EXPIRATION:10800000}"
