services:
  mysql-primary:
    image: mysql:8.0
    container_name: kira-mysql-primary
    ports:
      - "${DB_PRIMARY_PORT_PUBLISHED:-3310}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-1234}"
      DB_REPL_USER: "${DB_REPL_USER:-repl_user}"
      DB_REPL_PASSWORD: "${DB_REPL_PASSWORD:-repl_password}"
      MYSQL_DATABASE: "${DB_NAME:-kira}"
      MYSQL_USER: "${DB_APP_USER:-kira_user}"
      MYSQL_PASSWORD: "${DB_APP_PASSWORD:-kira_password}"
    volumes:
      - mysql-primary-data:/var/lib/mysql
      - ./mysql/primary/conf.d:/etc/mysql/conf.d:ro
      - ./mysql/primary/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  mysql-replica:
    image: mysql:8.0
    container_name: kira-mysql-replica
    ports:
      - "${DB_REPLICA_PORT_PUBLISHED:-3311}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-1234}"
      MYSQL_DATABASE: "${DB_NAME:-kira}"
      MYSQL_USER: "${DB_APP_USER:-kira_user}"
      MYSQL_PASSWORD: "${DB_APP_PASSWORD:-kira_password}"
      DB_REPL_USER: "${DB_REPL_USER:-repl_user}"
      DB_REPL_PASSWORD: "${DB_REPL_PASSWORD:-repl_password}"
      DB_PRIMARY_HOST: "${DB_PRIMARY_HOST:-mysql-primary}"
      DB_PRIMARY_PORT: "${DB_PRIMARY_PORT:-3306}"
    depends_on:
      mysql-primary:
        condition: service_healthy
    volumes:
      - mysql-replica-data:/var/lib/mysql
      - ./mysql/replica/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  mysql-replica-init:
    image: mysql:8.0
    container_name: kira-mysql-replica-init
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-1234}"
      DB_REPL_USER: "${DB_REPL_USER:-repl_user}"
      DB_REPL_PASSWORD: "${DB_REPL_PASSWORD:-repl_password}"
      DB_PRIMARY_HOST: "${DB_PRIMARY_HOST:-mysql-primary}"
      DB_PRIMARY_PORT: "${DB_PRIMARY_PORT:-3306}"
    command: >
      sh -ec "
      until mysql -h mysql-replica -P3306 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1' >/dev/null 2>&1; do sleep 2; done;
      mysql -h mysql-replica -P3306 -uroot -p$$MYSQL_ROOT_PASSWORD -e \"
      STOP REPLICA;
      RESET REPLICA ALL;
      CHANGE REPLICATION SOURCE TO
        SOURCE_HOST='$$DB_PRIMARY_HOST',
        SOURCE_PORT=$$DB_PRIMARY_PORT,
        SOURCE_USER='$$DB_REPL_USER',
        SOURCE_PASSWORD='$$DB_REPL_PASSWORD',
        SOURCE_AUTO_POSITION=1,
        GET_SOURCE_PUBLIC_KEY=1;
      START REPLICA;
      SET GLOBAL read_only = ON;
      SET GLOBAL super_read_only = ON;
      SHOW REPLICA STATUS\\\\G
      \";
      "
    restart: "no"

  rabbitmq:
    # Image có sẵn plugin management (UI http://localhost:15672). `rabbitmq:latest` không bật UI.
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - ${RABBITMQ_DATA_DIR:-./data/rabbitmq}:/var/lib/rabbitmq
      - ${RABBITMQ_LOG_DIR:-./data/rabbitmq-logs}:/var/log/rabbitmq
    restart: unless-stopped

  kira-ui:
    profiles: ["apps"]
    image: kira-ui:local
    build:
      context: ./kira-ui
      dockerfile: Dockerfile
    container_name: kira-ui
    ports:
      - "${KIRA_UI_PORT_PUBLISHED:-4200}:80"
    restart: unless-stopped

  kira-gateway-1:
    profiles: ["apps"]
    image: kira-gateway:local
    build:
      context: ./kira-gateway
      dockerfile: Dockerfile
    container_name: kira-gateway-1
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    ports:
      - "${KIRA_GATEWAY_PORT_1:-6868}:${KIRA_GATEWAY_PORT_1:-6868}"
    environment:
      SERVER_PORT: "${KIRA_GATEWAY_PORT_1:-6868}"
      INSTANCE_ID: gateway-1
      LOG_DIR: /app/logs
      DB_EX_HOST: mysql-primary
      DB_EX_PORT: "3306"
      DB_EX_NAME: "${DB_NAME:-kira}"
      DB_EX_USERNAME: "${DB_APP_USER:-kira_user}"
      DB_EX_PASSWORD: "${DB_APP_PASSWORD:-kira_password}"
      DB_PRIMARY_HOST: mysql-primary
      DB_PRIMARY_PORT: "3306"
      DB_PRIMARY_NAME: "${DB_NAME:-kira}"
      DB_PRIMARY_USERNAME: "${DB_APP_USER:-kira_user}"
      DB_PRIMARY_PASSWORD: "${DB_APP_PASSWORD:-kira_password}"
      DB_REPLICA_HOST: mysql-replica
      DB_REPLICA_PORT: "3306"
      DB_REPLICA_NAME: "${DB_NAME:-kira}"
      DB_REPLICA_USERNAME: "${DB_APP_USER:-kira_user}"
      DB_REPLICA_PASSWORD: "${DB_APP_PASSWORD:-kira_password}"
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USERNAME: guest
      RABBIT_PASSWORD: guest
      RABBIT_VHOST: /
      APP_DATA_MANAGER_BASE_URL: "${APP_DATA_MANAGER_BASE_URL:-http://nginx/data}"
      APP_KIRA_PRODUCER_BASE_URL: "${APP_KIRA_PRODUCER_BASE_URL:-http://kira-producer:2311}"
      APP_SECURITY_COOKIE_SECURE: "${APP_SECURITY_COOKIE_SECURE:-false}"
    restart: unless-stopped

  kira-gateway-2:
    profiles: ["apps"]
    image: kira-gateway:local
    build:
      context: ./kira-gateway
      dockerfile: Dockerfile
    container_name: kira-gateway-2
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    ports:
      - "${KIRA_GATEWAY_PORT_2:-6869}:${KIRA_GATEWAY_PORT_2:-6869}"
    environment:
      SERVER_PORT: "${KIRA_GATEWAY_PORT_2:-6869}"
      INSTANCE_ID: gateway-2
      LOG_DIR: /app/logs
      DB_EX_HOST: mysql-primary
      DB_EX_PORT: "3306"
      DB_EX_NAME: "${DB_NAME:-kira}"
      DB_EX_USERNAME: "${DB_APP_USER:-kira_user}"
      DB_EX_PASSWORD: "${DB_APP_PASSWORD:-kira_password}"
      DB_PRIMARY_HOST: mysql-primary
      DB_PRIMARY_PORT: "3306"
      DB_PRIMARY_NAME: "${DB_NAME:-kira}"
      DB_PRIMARY_USERNAME: "${DB_APP_USER:-kira_user}"
      DB_PRIMARY_PASSWORD: "${DB_APP_PASSWORD:-kira_password}"
      DB_REPLICA_HOST: mysql-replica
      DB_REPLICA_PORT: "3306"
      DB_REPLICA_NAME: "${DB_NAME:-kira}"
      DB_REPLICA_USERNAME: "${DB_APP_USER:-kira_user}"
      DB_REPLICA_PASSWORD: "${DB_APP_PASSWORD:-kira_password}"
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USERNAME: guest
      RABBIT_PASSWORD: guest
      RABBIT_VHOST: /
      APP_DATA_MANAGER_BASE_URL: "${APP_DATA_MANAGER_BASE_URL:-http://nginx/data}"
      APP_KIRA_PRODUCER_BASE_URL: "${APP_KIRA_PRODUCER_BASE_URL:-http://kira-producer:2311}"
      APP_SECURITY_COOKIE_SECURE: "${APP_SECURITY_COOKIE_SECURE:-false}"
    restart: unless-stopped

  kira-data-manager-1:
    profiles: ["apps"]
    image: kira-data-manager:local
    build:
      context: ./kira-data-manager
      dockerfile: Dockerfile
    container_name: kira-data-manager-1
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
    ports:
      - "${KIRA_DATA_MANAGER_PORT_1:-7777}:${KIRA_DATA_MANAGER_PORT_1:-7777}"
    environment:
      SERVER_PORT: "${KIRA_DATA_MANAGER_PORT_1:-7777}"
      LOG_FILE: /app/logs/kira-data-manager-1.log
      DB_HOST: mysql-primary
      DB_PRIMARY_PORT: "3306"
      DB_PRIMARY_NAME: "${DB_NAME:-kira}"
      DB_PRIMARY_USERNAME: "${DB_APP_USER:-kira_user}"
      DB_PRIMARY_PASSWORD: "${DB_APP_PASSWORD:-kira_password}"
      DB_READ_HOST: mysql-replica
      DB_READ_PORT: "3306"
    restart: unless-stopped

  kira-data-manager-2:
    profiles: ["apps"]
    image: kira-data-manager:local
    build:
      context: ./kira-data-manager
      dockerfile: Dockerfile
    container_name: kira-data-manager-2
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
    ports:
      - "${KIRA_DATA_MANAGER_PORT_2:-7778}:${KIRA_DATA_MANAGER_PORT_2:-7778}"
    environment:
      SERVER_PORT: "${KIRA_DATA_MANAGER_PORT_2:-7778}"
      LOG_FILE: /app/logs/kira-data-manager-2.log
      DB_HOST: mysql-primary
      DB_PRIMARY_PORT: "3306"
      DB_PRIMARY_NAME: "${DB_NAME:-kira}"
      DB_PRIMARY_USERNAME: "${DB_APP_USER:-kira_user}"
      DB_PRIMARY_PASSWORD: "${DB_APP_PASSWORD:-kira_password}"
      DB_READ_HOST: mysql-replica
      DB_READ_PORT: "3306"
    restart: unless-stopped

  kira-producer:
    profiles: ["apps"]
    image: kira-producer:local
    build:
      context: ./kira-producer
      dockerfile: Dockerfile
    container_name: kira-producer
    depends_on:
      mysql-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    ports:
      - "${KIRA_PRODUCER_PORT_PUBLISHED:-2311}:2311"
    environment:
      KIRA_PRODUCER_PORT: "2311"
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USERNAME: guest
      RABBIT_PASSWORD: guest
      RABBIT_VHOST: /
      DB_EX_HOST: mysql-primary
      DB_EX_PORT: "3306"
      DB_EX_NAME: "${DB_NAME:-kira}"
      DB_EX_USERNAME: "${DB_APP_USER:-kira_user}"
      DB_EX_PASSWORD: "${DB_APP_PASSWORD:-kira_password}"
      # Đặt false khi kira-service vẫn chạy crawl schedule trên host (tránh trùng publish).
      # Tùy chọn tách: KIRA_PRODUCER_CRAWL_SCHEDULE_DATE_ENABLED / KIRA_PRODUCER_CRAWL_SCHEDULE_EVENT_ENABLED
      # (ưu tiên hơn biến tổng bên dưới khi set).
      KIRA_PRODUCER_CRAWL_SCHEDULE_ENABLED: "${KIRA_PRODUCER_CRAWL_SCHEDULE_ENABLED:-true}"
    restart: unless-stopped

  # ─── Monitoring (Loki + Promtail + Grafana) — config trong ./monitoring/ ───
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.5.12
    container_name: promtail
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yaml
      - ./logs:/var/log/kira:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: 3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - loki
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: kira-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    # Prefer IPv4 for host.docker.internal (avoids upstream IPv6 that Docker cannot route).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KIRA_SERVICE_HOST: "${KIRA_SERVICE_HOST:-host.docker.internal}"
      KIRA_SERVICE_PORT: "${KIRA_SERVICE_PORT:-2308}"
      KIRA_QUEUE_HOST: "${KIRA_QUEUE_HOST:-host.docker.internal}"
      KIRA_QUEUE_PORT: "${KIRA_QUEUE_PORT:-2323}"
      KIRA_GATEWAY_HOST_1: "${KIRA_GATEWAY_HOST_1:-host.docker.internal}"
      KIRA_GATEWAY_PORT_1: "${KIRA_GATEWAY_PORT_1:-6868}"
      KIRA_GATEWAY_HOST_2: "${KIRA_GATEWAY_HOST_2:-host.docker.internal}"
      KIRA_GATEWAY_PORT_2: "${KIRA_GATEWAY_PORT_2:-6869}"
      KIRA_DATA_MANAGER_HOST_1: "${KIRA_DATA_MANAGER_HOST_1:-host.docker.internal}"
      KIRA_DATA_MANAGER_PORT_1: "${KIRA_DATA_MANAGER_PORT_1:-7777}"
      KIRA_DATA_MANAGER_HOST_2: "${KIRA_DATA_MANAGER_HOST_2:-host.docker.internal}"
      KIRA_DATA_MANAGER_PORT_2: "${KIRA_DATA_MANAGER_PORT_2:-7778}"
      KIRA_TOOL_SERVICE_HOST: "${KIRA_TOOL_SERVICE_HOST:-host.docker.internal}"
      KIRA_TOOL_SERVICE_PORT: "${KIRA_TOOL_SERVICE_PORT:-1406}"
      KIRA_UI_HOST: "${KIRA_UI_HOST:-host.docker.internal}"
      KIRA_UI_PORT: "${KIRA_UI_PORT:-4200}"
      NGINX_SERVER_NAME: "${NGINX_SERVER_NAME:-localhost kira.local}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
  mysql-primary-data:
  mysql-replica-data:
