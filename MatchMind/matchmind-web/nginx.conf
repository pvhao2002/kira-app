# Provider callbacks are reachable without a session: cap each client IP so junk-key floods cannot fill the audit log.
limit_req_zone $binary_remote_addr zone=external_api:10m rate=10r/s;

# HSTS only when the request reached us over HTTPS (the TLS proxy in front sets X-Forwarded-Proto). An empty value
# makes nginx omit the header, so plain-HTTP local runs never send it.
map $http_x_forwarded_proto $hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

# Grafana (under /monitor/) keeps a live websocket open.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 2m;

    # Client IP: by default $remote_addr is the TCP peer and every proxied request carries it as X-Forwarded-For
    # (below), replacing anything the client sent, so no client can pick the IP shown in audit logs or rate limits.
    # Behind a TLS reverse proxy, trust ONLY that proxy: mount a file such as
    #     set_real_ip_from 172.18.0.1;       # exact IP of the proxy hop as this container sees it, never a wide range
    #     real_ip_header X-Forwarded-For;
    # into /etc/nginx/real-ip.d/ (see README, "Client IP behind a reverse proxy"). The directory is empty by default.
    include /etc/nginx/real-ip.d/*.conf;

    # Compression for the SPA and JSON. text/event-stream is not listed, so the live stream stays unbuffered.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # Security headers have exactly one owner per path. /api/*: the API (Spring Security) sets CSP, X-Frame-Options,
    # nosniff and Referrer-Policy, nginx adds only HSTS. Everything else (SPA, static files): nginx sets them.
    # add_header is not inherited into a location that has its own add_header, so each block lists what it needs.

    location = /healthz { access_log off; return 200 "ok"; }

    # The old root Swagger paths: never answer with the SPA's index.html.
    location ~ ^/(swagger-ui|v3/api-docs) {
        return 404;
    }

    # Swagger UI (SWAGGER_ENABLED), MatchMind admins only: the same mm_monitor cookie check as /monitor/ below.
    location ^~ /swagger/ {
        auth_request /_monitor_auth;
        error_page 401 403 = @monitor_denied;
        add_header Strict-Transport-Security $hsts always;
        proxy_pass http://api:8090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/v1/external/ {
        limit_req zone=external_api burst=50 nodelay;
        limit_req_status 429;
        add_header Strict-Transport-Security $hsts always;
        proxy_pass http://api:8090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_read_timeout 120s;
    }

    # Live prediction stream (Server-Sent Events): deliver each event at once, and let the host proxy see
    # the API's X-Accel-Buffering: no as well. The API pings every 25 s, well inside the read timeout.
    location = /api/v1/events/predictions {
        add_header Strict-Transport-Security $hsts always;
        proxy_pass http://api:8090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 1h;
    }

    # Login and token responses carry credentials: never compress them (BREACH).
    location /api/v1/auth/ {
        gzip off;
        add_header Strict-Transport-Security $hsts always;
        proxy_pass http://api:8090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_read_timeout 120s;
    }

    # Same-origin API: the browser never needs CORS in this deployment.
    location /api/ {
        location = /api/v1/account/images {
            client_max_body_size 40m;
            proxy_pass http://api:8090;
        }
        add_header Strict-Transport-Security $hsts always;
        proxy_pass http://api:8090;
        proxy_set_header Host $http_host;  # keep the port: Spring compares it with Origin (same-origin check)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_read_timeout 120s;
    }

    # Log monitoring (compose profile "monitoring"): Grafana, MatchMind admins only. Every request is checked by the API
    # (auth_request: the mm_monitor cookie set by POST /api/v1/auth/monitor-session), and only the username it returns
    # reaches Grafana's auth proxy; a client-sent X-WEBAUTH-USER is always replaced. ^~ keeps Grafana's own .js/.css
    # out of the static-file regex below. Grafana is looked up per request, so this nginx starts without it.
    location ^~ /monitor/ {
        auth_request /_monitor_auth;
        auth_request_set $monitor_user $upstream_http_x_monitor_user;
        error_page 401 403 = @monitor_denied;
        add_header Strict-Transport-Security $hsts always;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-WEBAUTH-USER $monitor_user;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # ponytail: one API check per Grafana request (fine for a few admins); add proxy_cache keyed on the cookie if it shows up in load.
    location = /_monitor_auth {
        internal;
        proxy_pass http://api:8090/api/v1/auth/monitor-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No or expired admin session: back to the app, whose Monitor / API Docs menu items sign this tab in again.
    location @monitor_denied {
        absolute_redirect off;   # behind the TLS proxy $scheme is http: a relative Location keeps https
        return 302 /;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $hsts always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security $hsts always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
