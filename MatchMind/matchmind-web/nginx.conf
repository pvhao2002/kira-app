# Provider callbacks are reachable without a session: cap each client IP so junk-key floods cannot fill the audit log.
limit_req_zone $binary_remote_addr zone=external_api:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 2m;

    # A host reverse proxy (TLS) reaches this container from a Docker network: take the client IP it forwards,
    # so rate limits and the audit log see real clients. Direct callers outside these ranges cannot spoof it.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location = /healthz { access_log off; return 200 "ok"; }

    location /api/v1/external/ {
        limit_req zone=external_api burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_read_timeout 120s;
    }

    # Live prediction stream (Server-Sent Events): deliver each event at once, and let the host proxy see
    # the API's X-Accel-Buffering: no as well. The API pings every 25 s, well inside the read timeout.
    location = /api/v1/events/predictions {
        proxy_pass http://api:8090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 1h;
    }

    # Same-origin API: the browser never needs CORS in this deployment.
    location /api/ {
        proxy_pass http://api:8090;
        proxy_set_header Host $http_host;  # keep the port: Spring compares it with Origin (same-origin check)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_read_timeout 120s;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
