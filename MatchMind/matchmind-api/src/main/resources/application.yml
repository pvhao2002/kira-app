server:
  port: ${SERVER_PORT:8090}
  forward-headers-strategy: NONE
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: matchmind-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/matchmind_db}
    username: ${DB_USERNAME:matchmind}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema is owned by Flyway only
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  mvc:
    problemdetails:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:PT8H}
    # Hard limit from the password sign-in, however often the token is refreshed (POST /auth/refresh).
    max-session: ${JWT_MAX_SESSION:PT24H}
  # Shared key every AI agent sends in X-Api-Key (32+ characters). Required: the API does not start without it.
  external-api-key: ${EXTERNAL_API_KEY:}
  # Google Sheet that agents append the requests they could not send to; the admin copy of the prompts names it.
  matchmind-sheet-url: ${MATCHMIND_SHEET_URL:}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1/32,::1/128}
  bootstrap-admin:
    username: ${MATCHMIND_ADMIN_USERNAME:}
    password: ${MATCHMIND_ADMIN_PASSWORD:}
  # Only failed attempts count: per client IP (any user name) and per (user name, client IP) pair.
  login-rate-limit:
    max-attempts-per-ip: ${LOGIN_MAX_ATTEMPTS_PER_IP:30}
    max-failures-per-user: ${LOGIN_MAX_FAILURES_PER_USER:5}
  # Calls to /api/v1/external/** with a missing or wrong key: 429 past this many per IP per window.
  external-rate-limit:
    max-rejected-per-ip: ${EXTERNAL_MAX_REJECTED_PER_IP:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-}]"
